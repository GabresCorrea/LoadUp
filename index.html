}

// ── SUGGESTION ────────────────────────────────────
function getSuggestion(exName){
  if(!exName)return null;
  const history=[];
  S.log.forEach(entry=>{
    const ex=entry.exercises.find(e=>e.name===exName);
    if(ex){const maxW=Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
      const avgR=ex.sets.reduce((a,s)=>a+(parseFloat(s.reps)||0),0)/ex.sets.length;
      if(maxW>0)history.push({maxW,avgR,sets:ex.sets.length});}
  });
  if(!history.length)return null;
  const last=history[0];
  if(last.avgR>=12)return{weight:last.maxW+2.5,reps:10,reason:`Última sessão: ${last.avgR.toFixed(0)} reps → hora de aumentar!`};
  if(last.avgR<8)return{weight:last.maxW,reps:Math.round(last.avgR+1),reason:`Mantenha ${last.maxW}kg e tente mais reps`};
  return{weight:last.maxW,reps:Math.round(last.avgR),reason:`Repita: ${last.sets}×${Math.round(last.avgR)} com ${last.maxW}kg`};
}

// ── LAST SESSION ──────────────────────────────────
function getLastSession(exName){
  if(!exName)return null;
  for(const entry of S.log){
    const ex=entry.exercises.find(e=>e.name===exName);
    if(ex)return ex.sets;
  }
  return null;
}

// ── CHART ─────────────────────────────────────────
function getChartData(exName){
  const pts=[];
  S.log.forEach(entry=>{const ex=entry.exercises.find(e=>e.name===exName);
    if(ex){
      const validSets=ex.sets.filter(isEffectiveSet);
      const maxW=Math.max(...ex.sets.map(s=>parseFloat(s.weight)||0));
      const maxReps=Math.max(...validSets.map(s=>parseFloat(s.reps)||0));
      const vol=calcExVol(ex);
      if(maxW>0||vol>0)pts.push({date:entry.date,maxW,vol,maxReps,sets:validSets.length});
    }
  });
  return pts.reverse().slice(-20); // last 20 sessions
}

function checkMedals(stats,medals){return MEDALS.filter(m=>!medals.includes(m.id)&&m.check(stats))}

// ── 1RM ESTIMATION (Epley formula) ────────────────
// 1RM = weight × (1 + reps/30)  — most used in practice
function calc1RM(weight,reps){
  if(!weight||!reps||reps<=0)return 0;
  if(reps===1)return weight;
  return Math.round(weight*(1+reps/30)*10)/10;
}
// Get best estimated 1RM for an exercise across all log entries
function getBest1RM(exName){
  if(!exName)return null;
  let best=0;
  S.log.forEach(entry=>{
    const ex=entry.exercises.find(e=>e.name===exName);
    if(!ex)return;
    ex.sets.filter(isEffectiveSet).forEach(s=>{
      const w=parseFloat(s.weight)||0;
      const r=parseFloat(s.reps)||0;
      if(w>0&&r>0){
        const est=calc1RM(w,r);
        if(est>best)best=est;
      }
    });
  });
  return best>0?best:null;
}
// Get 1RM history for chart
function get1RMHistory(exName){
  const pts=[];
  S.log.forEach(entry=>{
    const ex=entry.exercises.find(e=>e.name===exName);
    if(!ex)return;
    let best=0;
    ex.sets.filter(isEffectiveSet).forEach(s=>{
      const w=parseFloat(s.weight)||0;
      const r=parseFloat(s.reps)||0;
      if(w>0&&r>0){const est=calc1RM(w,r);if(est>best)best=est;}
    });
    if(best>0)pts.push({date:entry.date,val:best});
  });
  return pts.reverse().slice(-20);
}

// ── PLATEAU DETECTION ─────────────────────────────
function getPlateauStatus(exName){
  if(!exName)return null;
  const pts=getChartData(exName);
  if(pts.length<3)return null;
  const recent=pts.slice(-4); // last 4 sessions
  const weights=recent.map(p=>p.maxW);
  const maxW=Math.max(...weights);
  const minW=Math.min(...weights);
  const variance=maxW-minW;
  const sessions=recent.length;
  if(sessions>=3&&variance<=2.5){
    // Plateau confirmed — suggest action
    const avgReps=recent.reduce((a,p)=>a+(p.maxReps||0),0)/sessions;
    if(avgReps>=11)return{type:'weight',msg:'Aumente 2.5kg — reps altas há '+sessions+' sessões'};
    if(avgReps<=6)return{type:'reps',msg:'Foque em reps: tente +1 rep por série'};
    return{type:'plateau',msg:'Platô de '+sessions+' sessões — considere variação'};
  }
  return null;
}

// ── MINI CHART (inline SVG sparkline) ─────────────
function buildMiniChart(exName,color){
  if(!exName)return'';
  const pts=getChartData(exName).slice(-6);
  if(pts.length<2)return'';
  const vals=pts.map(p=>p.maxW);
  const minV=Math.min(...vals),maxV=Math.max(...vals);
  const range=maxV-minV||1;
  const W=120,H=32,pad=4;
  const cW=W-pad*2,cH=H-pad*2;
  const xs=pts.map((_,i)=>pad+Math.round((i/(pts.length-1))*cW));
  const ys=pts.map(p=>pad+Math.round(cH*(1-(p.maxW-minV)/range)));
  // Build polyline points
  const points=xs.map((x,i)=>x+','+ys[i]).join(' ');
  // Fill area path
  const fillPath='M'+xs[0]+','+ys[0]+' '+xs.map((x,i)=>x+','+ys[i]).join(' L')+' L'+xs[xs.length-1]+','+(H-pad)+' L'+xs[0]+','+(H-pad)+' Z';
  const lastX=xs[xs.length-1],lastY=ys[ys.length-1];
  const lastVal=vals[vals.length-1];
  const trend=vals.length>1?(vals[vals.length-1]>vals[vals.length-2]?'up':vals[vals.length-1]<vals[vals.length-2]?'down':'flat'):'flat';
  const trendColor=trend==='up'?'#4caf50':trend==='down'?'#e74c3c':'#888';
  return'<div class="mini-chart-wrap" style="margin:8px 0 4px;position:relative">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px">'+
      '<span style="font-size:9px;color:#888;letter-spacing:1.5px">ÚLTIMAS '+pts.length+' SESSÕES</span>'+
      '<span style="font-size:11px;font-weight:800;color:'+trendColor+'">'+
        (trend==='up'?'▲':trend==='down'?'▼':'–')+' '+lastVal.toFixed(1)+'kg'+
      '</span>'+
    '</div>'+
    '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px;display:block">'+
      '<path d="'+fillPath+'" fill="'+color+'" opacity=".12"/>'+
      '<polyline points="'+points+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map((p,i)=>'<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="'+(i===pts.length-1?3.5:2)+'" fill="'+(i===pts.length-1?'#fff':color)+'" opacity="'+(i===pts.length-1?1:.7)+'"/>').join('')+
      '<text x="'+lastX+'" y="'+(lastY-6)+'" text-anchor="middle" fill="#fff" font-size="9" font-family="Barlow" font-weight="700">'+lastVal.toFixed(0)+'</text>'+
    '</svg>'+
  '</div>';
}

  // labels de data (primeira, meio, última)

      '<span style="font-size:9px;color:var(--t3);letter-spacing:1.5px">'+n+' SESSÕES</span>'+
      '<span style="font-size:12px;font-weight:800;color:'+diffColor+'">'+diffTxt+'</span>'+
    '</div>'+
    '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+
      // grid lines (min/max)
      '<line x1="'+padL+'" y1="'+padT+'" x2="'+(W-padR)+'" y2="'+padT+'" stroke="#1a1a1a" stroke-width="1"/>'+
      '<line x1="'+padL+'" y1="'+(padT+cH)+'" x2="'+(W-padR)+'" y2="'+(padT+cH)+'" stroke="#1a1a1a" stroke-width="1"/>'+
      '<text x="'+padL+'" y="'+(padT-5)+'" fill="#555" font-size="9" font-family="Barlow">'+fmt(maxV)+unit+'</text>'+
      '<text x="'+padL+'" y="'+(padT+cH+13)+'" fill="#555" font-size="9" font-family="Barlow">'+fmt(minV)+unit+'</text>'+
      '<path d="'+fillPath+'" fill="'+color+'" opacity=".10"/>'+
      '<polyline points="'+points+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      vals.map((v,i)=>'<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="'+(i===n-1?4:2.5)+'" fill="'+(i===n-1?'#fff':color)+'" opacity="'+(i===n-1?1:.75)+'"/>').join('')+
      '<text x="'+xs[n-1]+'" y="'+(ys[n-1]-8)+'" text-anchor="end" fill="#fff" font-size="10" font-family="Barlow" font-weight="700">'+fmt(last)+'</text>'+
      // date labels
      '<text x="'+padL+'" y="'+(H-4)+'" fill="#444" font-size="8" font-family="Barlow">'+dLbl(0)+'</text>'+
      '<text x="'+(W-padR)+'" y="'+(H-4)+'" text-anchor="end" fill="#444" font-size="8" font-family="Barlow">'+dLbl(n-1)+'</text>'+

// ── WEEKLY VOLUME TREND ───────────────────────────
function getWeeklyVolumeTrend(numWeeks,routineName){
  const weeks=[];
  const weekMs=7*24*60*60*1000;
  const curStart=startOfWeek(); // domingo da semana atual, 00:00
  for(let w=numWeeks-1;w>=0;w--){
    const wStart=curStart-w*weekMs;       // domingo de "w" semanas atrás
    const wEnd=wStart+weekMs;             // domingo seguinte
    const vol=S.log
      .filter(l=>{const t=new Date(l.date).getTime();return t>=wStart&&t<wEnd;})
      .filter(l=>!routineName||l.routineName===routineName) // filtro opcional por treino
      .reduce((a,l)=>a+l.volume,0);
    const label=w===0?'Esta sem':w===1?'Sem. ant.':'há '+(w+1)+'sem';
    weeks.push({vol,label,w});
  }
  return weeks;
}

// ── DELOAD / FADIGA ACUMULADA ──────────────────────
// Análise de nível semanal (visão de treinador): olha as últimas semanas de
// volume total + frequência para sinalizar quando uma semana de descarga (deload)
// é recomendada. Conservador de propósito — só sugere com dados suficientes.
function getDeloadStatus(){
  // Usa semanas COMPLETAS (ignora a semana atual, ainda em andamento)
  const trend=getWeeklyVolumeTrend(8).filter(w=>w.w>=1); // semanas 1..7 atrás
  const weeksWithData=trend.filter(w=>w.vol>0);
  if(weeksWithData.length<3)return null; // precisa de histórico mínimo

  // Conta semanas consecutivas treinadas, terminando na semana mais recente COM treino.
  // (Ignora um eventual "buraco" só na semana mais recente, que pode ser início de semana.)
  let streak=0;
  let started=false;
  for(let i=trend.length-1;i>=0;i--){
    if(trend[i].vol>0){started=true;streak++;}
    else if(started){break;} // só interrompe depois que já achou treino
  }

  // Volume médio das semanas com treino e o pico
  const vols=weeksWithData.map(w=>w.vol);
  const avg=vols.reduce((a,v)=>a+v,0)/vols.length;
  const peak=Math.max(...vols);

  // Últimas 3 semanas completas com treino (para ver tendência recente)
  const last3=weeksWithData.slice(-3);
  let stalledOrFalling=false;
  if(last3.length===3){
    // Estagnou: variação <5% entre elas; ou caindo: cada uma menor que a anterior
    const a=last3[0].vol,b=last3[1].vol,c=last3[2].vol;
    const falling=(b<a&&c<b);
    const range=(Math.max(a,b,c)-Math.min(a,b,c))/Math.max(a,b,c);
    const stalledHigh=(range<0.08 && c>=avg*0.9); // platô em volume alto
    stalledOrFalling=falling||stalledHigh;
  }

  // Regra 1: muitas semanas seguidas sem descarga → fadiga acumulada provável
  if(streak>=6){
    return{level:'high',title:'Semana de deload recomendada',
      msg:streak+' semanas seguidas treinando sem descarga. Uma semana mais leve (–40% no volume) ajuda a recuperar e voltar mais forte.'};
  }
  // Regra 2: 4-5 semanas seguidas E volume estagnado/caindo no topo → sinal de fadiga
  if(streak>=4&&stalledOrFalling){
    return{level:'medium',title:'Considere uma descarga em breve',
      msg:'Seu volume vem estagnando há algumas semanas em carga alta — sinal clássico de fadiga acumulada. Planeje uma semana de deload nas próximas.'};
  }
  // Regra 3: tudo certo — progressão saudável
  return{level:'ok',title:'Progressão saudável',
    msg:'Sem sinais de fadiga acumulada. Continue progredindo — o app avisa quando uma descarga fizer sentido.'};
}

// ── PREDICTED TRAINING DAYS ───────────────────────
function getPredictedDays(){
  if(S.log.length<4)return[];
  // Count workouts per weekday (0=Sun..6=Sat)
  const counts=Array(7).fill(0);
  S.log.slice(0,20).forEach(l=>{counts[new Date(l.date).getDay()]++});
  const maxCount=Math.max(...counts);
  if(!maxCount)return[];
  // Return weekdays that have ≥50% of the max frequency
  return counts.map((c,i)=>c>=(maxCount*0.5)?i:-1).filter(i=>i>=0);
}

// ── TIMER ─────────────────────────────────────────
// Atualiza a UI do timer a partir do tempo restante calculado por timestamp
function tickTimer(){
  timerSecs=Math.max(0,Math.round((timerEndAt-Date.now())/1000));
  const el=document.getElementById('timer-val');
  const lbl=document.getElementById('timer-lbl');
  const ring=document.getElementById('timer-fg');
  if(el)el.textContent=formatTime(timerSecs);
  if(lbl)lbl.textContent=timerSecs>0?'DESCANSANDO':'PRONTO! 🔥';
  if(ring){
    const C=2*Math.PI*88;
    ring.style.strokeDashoffset=C-(C*(timerTotal>0?timerSecs/timerTotal:0));
    ring.setAttribute('stroke',timerSecs<=5?'#e74c3c':timerSecs<=15?'#f39c12':'var(--gold)');
  }
  // Atualiza a pílula minimizada, se existir
  const pill=document.getElementById('timer-pill-val');
  if(pill)pill.textContent=formatTime(timerSecs);
  if(timerSecs<=0&&!timerFired){
    timerFired=true;
    fireTimerEnd();
  }
}
// Dispara o alerta de fim: vibração + brilho nas bordas
function fireTimerEnd(){
  try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);}catch{}
  const fl=document.createElement('div');fl.className='timer-glow';
  document.body.appendChild(fl);
  setTimeout(()=>fl.remove(),2400);
}
// Inicia/reinicia o timer. Se keepOverlay=false, mantém o estado mas não força render.
function startTimerCore(secs,exName){
  clearInterval(timerInterval);
  timerTotal=secs;timerSecs=secs;timerExName=exName||'';
  timerActive=true;timerFired=false;
  timerEndAt=Date.now()+secs*1000;
  timerInterval=setInterval(tickTimer,250); // 250ms = atualização suave e recalculada
}
function startTimerNoRender(secs,exName){
  timerMinimized=false;
  startTimerCore(secs,exName);
  const existing=document.getElementById('timer-overlay-wrap');
  if(existing)existing.remove();
  const overlay=document.createElement('div');
  overlay.id='timer-overlay-wrap';
  overlay.innerHTML=buildTimerOverlay();
  document.body.appendChild(overlay);
  bindTimerControls();
  tickTimer();
}
// Inicia o timer já minimizado (pílula flutuante), sem ocupar a tela toda.
// Usado ao marcar o check de uma série, para um fluxo mais ágil.
function startTimerMinimized(secs,exName){
  startTimerCore(secs,exName);

// Parse "1h 30m", "1:30", "90" (minutes) → seconds
function parseDurationInput(v){
  v=v.trim();
  const hm=v.match(/^(\d+)h\s*(\d+)?m?$/i);
  if(hm)return parseInt(hm[1])*3600+(parseInt(hm[2]||0)*60);
  const colon=v.match(/^(\d+):(\d{1,2})$/);
  if(colon)return parseInt(colon[1])*60+parseInt(colon[2]);
  const mins=v.match(/^(\d+)m?$/i);
  if(mins)return parseInt(mins[1])*60;
  return null;
}
function promptDuration(current,cb){
  const cur=current>0?formatWorkoutTime(current):'';
  openPrompt('Duração do treino','Formatos: "1:30" (1h30m), "45" (45min), "1h 20m"',cur,v=>{
    const s=parseDurationInput(v);
    if(s===null||s<0){notify('Formato inválido. Use "45", "1:30" ou "1h 20m"');return;}
    cb(s);
  });
}
// Converte string de data (DD/MM/AAAA ou DD/MM) para timestamp, preservando o horário original
function parseDateInput(v,originalDate){
  v=v.trim();
  const m=v.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(!m)return null;
  const dia=parseInt(m[1]),mes=parseInt(m[2]);
  let ano=m[3]?parseInt(m[3]):new Date(originalDate).getFullYear();
  if(ano<100)ano+=2000;
  if(dia<1||dia>31||mes<1||mes>12)return null;
  const orig=new Date(originalDate);
  // mantém hora/minuto/segundo do registro original
  const d=new Date(ano,mes-1,dia,orig.getHours(),orig.getMinutes(),orig.getSeconds());
  if(isNaN(d.getTime()))return null;
  return d.toISOString();
}
function promptDate(currentISO,cb){
  const d=new Date(currentISO);
  const cur=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
  openPrompt('Data do treino','Formato: DD/MM/AAAA (ex.: 15/03/2026)',cur,v=>{
    const iso=parseDateInput(v,currentISO);
    if(!iso){notify('Data inválida. Use DD/MM/AAAA');return;}
    cb(iso);
  });
}

// ── MERGE de estados (local × nuvem) ──────────────────────────────
// Em vez de "o último a salvar apaga o resto" (risco real de perder treino feito
// em outro aparelho), a sincronização agora UNE os dois lados: nada que já existe
// em qualquer um dos lados é descartado. Listas (treinos, cardio, rotinas) são
// unidas por id; PRs ficam com o maior valor; medalhas são a união; stats são
// recalculadas a partir do resultado mesclado (nunca diminuem).
function mergeStates(local,remote){
  if(!remote||typeof remote!=='object')return local;
  local=local||{};
  const byId=arr=>{const m={};(arr||[]).forEach(x=>{if(x&&x.id)m[x.id]=x;});return m;};
  const mergeById=(a,b)=>{
    const map=byId(b); // remoto primeiro
    (a||[]).forEach(x=>{if(x&&x.id)map[x.id]=x;}); // local sobrescreve em caso de mesmo id (é a versão mais "fresca" deste aparelho)
    const out=Object.values(map);
    if(out.length&&out[0]&&out[0].date!==undefined)out.sort((x,y)=>new Date(y.date)-new Date(x.date));
    return out;
  };
  const merged={...local};
  merged.log=mergeById(local.log,remote.log);
  merged.cardioLog=mergeById(local.cardioLog,remote.cardioLog);
  const routineMap=byId(remote.routines);
  (local.routines||[]).forEach(r=>{if(r&&r.id)routineMap[r.id]=r;});
  merged.routines=Object.values(routineMap);
  merged.prs={...(remote.prs||{})};
  Object.entries(local.prs||{}).forEach(([k,v])=>{if(typeof v==='number'&&(!(k in merged.prs)||v>merged.prs[k]))merged.prs[k]=v;});
  merged.medals=[...new Set([...(remote.medals||[]),...(local.medals||[])])];
  merged.weeklyGoals={...(remote.weeklyGoals||{}),...(local.weeklyGoals||{})};
  const localStats=local.stats||{},remoteStats=remote.stats||{};
  merged.stats={
    totalWorkouts:merged.log.length,
    totalRoutines:merged.routines.length,
    totalPRs:Math.max(localStats.totalPRs||0,remoteStats.totalPRs||0),
    maxVolume:Math.max(localStats.maxVolume||0,remoteStats.maxVolume||0,...merged.log.map(l=>l.volume||0),0),
  };
  if(remote.user&&local.user){
    merged.user={...remote.user,...local.user,profile:{...(remote.user.profile||{}),...(local.user.profile||{})},
      weightHistory:mergeById(local.user.weightHistory?local.user.weightHistory.map((w,i)=>({...w,id:w.id||('wh_'+i+'_'+w.date)})):[],
                               remote.user.weightHistory?remote.user.weightHistory.map((w,i)=>({...w,id:w.id||('wh_'+i+'_'+w.date)})):[])
        .sort((x,y)=>new Date(x.date)-new Date(y.date))};
  }else{
    merged.user=local.user||remote.user||null;
  }
  merged.restSeconds=local.restSeconds||remote.restSeconds||90;
  merged.activeSession=local.activeSession; // sessão em andamento é específica deste aparelho, não mescla
  merged.seenTutorial=local.seenTutorial||remote.seenTutorial||false;
  return migrateData(merged);
}
async function cloudSave(){
  if(!fbUser){notify('Entre com Google para salvar na nuvem.');return;}
  const btn=document.getElementById('cloud-save-btn');
  if(btn&&btn.disabled)return; // evita toque duplo
  let prev;
  if(btn){prev=btn.innerHTML;btn.disabled=true;btn.style.opacity='.7';btn.innerHTML='⏳ Salvando...';}
  try{
    // Antes de sobrescrever o documento da nuvem, busca o que já está lá e mescla
    // com o estado local — assim um treino salvo por outro aparelho depois do
    // último sync deste aqui não é apagado.
    let merged=S;
    try{
      const snap=await fbDb.collection('users').doc(fbUser.uid).get();
      if(snap.exists){
        const raw=snap.data();
        const dataStr=typeof raw.data==='string'?raw.data:JSON.stringify(raw.data);
        const remote=JSON.parse(dataStr);
        merged=mergeStates(S,remote);
      }
    }catch(e){/* não deu pra ler o remoto: segue salvando o local mesmo, melhor que travar */}
    S=merged;save(S);
    const dataStr=JSON.stringify(S);
    await fbDb.collection('users').doc(fbUser.uid).set({data:dataStr,savedAt:new Date().toISOString()});
    notify('☁ Salvo e mesclado com a nuvem! ✓');
    render();
  }catch(e){notify('Erro ao salvar: '+e.message);}
  finally{if(btn){btn.disabled=false;btn.style.opacity='';btn.innerHTML=prev;}}
}
async function cloudLoad(silent=false){
  if(!fbUser){if(!silent)notify('Entre com Google para restaurar.');return;}
  try{
    const snap=await fbDb.collection('users').doc(fbUser.uid).get();
    if(!snap.exists){if(!silent)notify('Nenhum backup encontrado.');return;}
    const raw=snap.data();
    // Compatível com formato novo (string) e antigo (objeto)
    const dataStr=typeof raw.data==='string'?raw.data:JSON.stringify(raw.data);
    const savedAt=raw.savedAt;
    let remote;
    try{remote=JSON.parse(dataStr);}catch(e){if(!silent)notify('Backup da nuvem ilegível.');return;}
    // "Restaurar" agora MESCLA em vez de substituir — nunca apaga o que já existe
    // neste aparelho, só traz o que estiver faltando (treinos, PRs, rotinas...).
    const doMerge=()=>{
      S=mergeStates(S,remote);
      save(S);notify('✅ Dados da nuvem mesclados!');render();
    };
    if(silent){
      // Login automático: mescla sempre. Como mesclar nunca remove dados locais,
      // não há mais motivo pra só restaurar "às cegas" quando o app está vazio.
      doMerge();
    }
    else{openConfirm('Trazer backup da nuvem?','Isso traz treinos, rotinas, PRs e conquistas salvos na nuvem (de '+new Date(savedAt).toLocaleString('pt-BR')+') e mescla com os dados deste aparelho. Nada do que já está aqui é apagado.',doMerge,{okLabel:'Mesclar',danger:false});}
  }catch(e){if(!silent)notify('Erro: '+e.message);}
}

function drawChartIfNeeded(){
  const canvas=document.getElementById('main-chart');if(!canvas)return;
  const pts=getChartData(chartExName);
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth,H=canvas.offsetHeight;
  canvas.width=W*window.devicePixelRatio;canvas.height=H*window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  ctx.clearRect(0,0,W,H);if(!pts.length)return;
  const vals=pts.map(p=>chartTab===0?p.maxW:chartTab===1?p.vol:(p.maxReps||0));
  const minV=Math.min(...vals)*0.9,maxV=Math.max(...vals)*1.05;const range=maxV-minV||1;
  const pad={l:44,r:16,t:16,b:32};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(f=>{const y=pad.t+cH*(1-f);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='#333';ctx.font='10px Barlow';ctx.textAlign='right';ctx.fillText((minV+range*f).toFixed(0),pad.l-6,y+4);});
  const xs=pts.map((_,i)=>pad.l+(i/(pts.length-1||1))*cW);
  const ys=pts.map(p=>{const v=chartTab===0?p.maxW:chartTab===1?p.vol:(p.maxReps||0);return pad.t+cH*(1-(v-minV)/range)});
  const grad=ctx.createLinearGradient(0,pad.t,0,H);grad.addColorStop(0,'rgba(240,192,64,.25)');grad.addColorStop(1,'rgba(240,192,64,0)');
  ctx.beginPath();ctx.moveTo(xs[0],ys[0]);
  for(let i=1;i<xs.length;i++){const mx=(xs[i-1]+xs[i])/2;ctx.bezierCurveTo(mx,ys[i-1],mx,ys[i],xs[i],ys[i])}
  ctx.lineTo(xs[xs.length-1],H-pad.b);ctx.lineTo(xs[0],H-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(xs[0],ys[0]);
  for(let i=1;i<xs.length;i++){const mx=(xs[i-1]+xs[i])/2;ctx.bezierCurveTo(mx,ys[i-1],mx,ys[i],xs[i],ys[i])}
  ctx.strokeStyle='var(--gold)';ctx.lineWidth=2.5;ctx.stroke();
  pts.forEach((p,i)=>{
    const isLast=i===pts.length-1;
    ctx.beginPath();ctx.arc(xs[i],ys[i],isLast?6:4,0,Math.PI*2);
    ctx.fillStyle=isLast?'#fff':'var(--gold)';ctx.fill();
    if(isLast){ctx.beginPath();ctx.arc(xs[i],ys[i],6,0,Math.PI*2);ctx.strokeStyle='var(--gold)';ctx.lineWidth=2;ctx.stroke();}
    const d=new Date(p.date);ctx.fillStyle='#444';ctx.font='9px Barlow';ctx.textAlign='center';ctx.fillText(`${d.getDate()}/${d.getMonth()+1}`,xs[i],H-pad.b+14);
    const val=chartTab===0?p.maxW:chartTab===1?p.vol.toFixed(0):(p.maxReps||0);
    ctx.fillStyle=isLast?'#fff':'#888';ctx.font=`${isLast?'bold ':''}10px Barlow`;ctx.fillText(val,xs[i],ys[i]-10);
  });
}

// Desenha o resumo do treino num canvas transparente e dispara compartilhar/baixar
async function shareWorkoutImage(fmt){
  const d=finishData;
  if(!d){notify('Nada para compartilhar.');return;}
  const scale=2; // densidade para telas retina
  const W=fmt==='story'?1080:1080;
  const H=fmt==='story'?1920:1080;
  const cv=document.createElement('canvas');
  cv.width=W*scale; cv.height=H*scale;
  const ctx=cv.getContext('2d');
  ctx.scale(scale,scale);
  const GOLD='#f0c040', GOLD_D='#c9a23a', TXT='#f2f2f2', SUB='#9a9a9a';
  const cx=W/2;
  // Painel central semi-translúcido (mantém transparência mas garante leitura)
  const padX=70;
  const panelX=padX, panelW=W-padX*2;
  const panelY=fmt==='story'?260:90, panelH=fmt==='story'?1400:900;
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  ctx.fillStyle='rgba(10,10,10,.78)';
  roundRect(panelX,panelY,panelW,panelH,40); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(240,192,64,.35)';
  roundRect(panelX,panelY,panelW,panelH,40); ctx.stroke();

  let y=panelY+90;
  // Marca LoadUp (centralizada: LOAD branco + UP dourado)
  ctx.font='900 46px Oswald, Arial, sans-serif';
  const tLoad='LOAD', tUp='UP';
  const wL=ctx.measureText(tLoad).width, wU=ctx.measureText(tUp).width;
  const totalW=wL+wU+10;
  let sx=cx-totalW/2;
  ctx.textAlign='left';
  ctx.fillStyle=TXT; ctx.fillText(tLoad,sx,y);
  ctx.fillStyle=GOLD; ctx.fillText(tUp,sx+wL+10,y);
  ctx.textAlign='center';

  y+=30;
  ctx.font='700 20px Barlow, Arial, sans-serif';
  ctx.fillStyle=SUB; ctx.fillText('TREINO CONCLUÍDO',cx,y);

  // Nome do treino
  y+=70;
  ctx.font='800 40px Oswald, Arial, sans-serif';
  ctx.fillStyle=GOLD;
  let rn=(d.routineName||'TREINO').toUpperCase();
  // trunca se muito longo
  while(ctx.measureText(rn).width>panelW-100 && rn.length>4){rn=rn.slice(0,-2);}
  ctx.fillText(rn,cx,y);

  // Data
  y+=44;
  const dt=new Date();
  const dataStr=('0'+dt.getDate()).slice(-2)+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+dt.getFullYear();
  ctx.font='600 22px Barlow, Arial, sans-serif';
  ctx.fillStyle=SUB; ctx.fillText(dataStr,cx,y);

  // Cartões de estatística (3): volume, séries, PRs
  y+=70;
  const durStr=(d.duration||0)>0?formatWorkoutTime(d.duration):'—';
  const stats=[
    {v:Math.round(d.volume||0).toLocaleString('pt-BR'), l:'KG VOLUME'},
    {v:String(d.validSets||0), l:'SÉRIES'},
    {v:String(d.prCount||0), l:'PRs'},
  ];
  const cardGap=20, cardW=(panelW-100-cardGap*2)/3, cardH=130;
  let cxs=panelX+50;
  stats.forEach(s=>{
    ctx.fillStyle='rgba(240,192,64,.08)';
    roundRect(cxs,y,cardW,cardH,18); ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='rgba(240,192,64,.25)';
    roundRect(cxs,y,cardW,cardH,18); ctx.stroke();
    ctx.textAlign='center';
    ctx.font='800 44px Oswald, Arial, sans-serif'; ctx.fillStyle=GOLD;
    // reduz fonte se número largo
    let fs=44; ctx.font=fs+'px Oswald'; while(ctx.measureText(s.v).width>cardW-20&&fs>22){fs-=2;ctx.font='800 '+fs+'px Oswald, Arial, sans-serif';}
    ctx.font='800 '+fs+'px Oswald, Arial, sans-serif';
    ctx.fillText(s.v,cxs+cardW/2,y+62);
    ctx.font='700 17px Barlow, Arial, sans-serif'; ctx.fillStyle=SUB;
    ctx.fillText(s.l,cxs+cardW/2,y+98);
    cxs+=cardW+cardGap;
  });

  // Duração (linha)
  y+=cardH+54;
  ctx.font='600 24px Barlow, Arial, sans-serif';
  ctx.fillStyle=SUB; ctx.textAlign='center';
  ctx.fillText('⏱  '+durStr+' de treino',cx,y);

  // Lista de exercícios
  y+=60;
  ctx.textAlign='left';
  ctx.font='800 22px Oswald, Arial, sans-serif';
  ctx.fillStyle=GOLD; ctx.fillText('EXERCÍCIOS',panelX+50,y);
  ctx.strokeStyle='rgba(240,192,64,.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(panelX+50,y+12); ctx.lineTo(panelX+panelW-50,y+12); ctx.stroke();
  y+=44;

  const exList=d.exercises.filter(e=>e.name);
  const maxRows=fmt==='story'?14:8;
  const rowH=fmt==='story'?54:46;
  ctx.font='600 24px Barlow, Arial, sans-serif';
  for(let i=0;i<Math.min(exList.length,maxRows);i++){
    const ex=exList[i];
    const validCount=ex.sets.filter(isEffectiveSet).length;
    const isPR=d.prExercises&&d.prExercises.includes(ex.name);
    ctx.textAlign='left'; ctx.fillStyle=TXT;
    let nm=ex.name;
    while(ctx.measureText(nm).width>panelW-260&&nm.length>4){nm=nm.slice(0,-2);}
    ctx.fillText((isPR?'⚡ ':'')+nm, panelX+50, y);
    ctx.textAlign='right'; ctx.fillStyle=SUB;
    ctx.fillText(validCount+(validCount===1?' série':' séries'), panelX+panelW-50, y);
    y+=rowH;
  }
  if(exList.length>maxRows){
    ctx.textAlign='center'; ctx.fillStyle=SUB; ctx.font='600 20px Barlow, Arial, sans-serif';
    ctx.fillText('+ '+(exList.length-maxRows)+' exercício(s)',cx,y+6);
  }

  // Rodapé
  ctx.textAlign='center';
  ctx.font='700 20px Barlow, Arial, sans-serif'; ctx.fillStyle=GOLD_D;
  ctx.fillText('Feito com LoadUp',cx,panelY+panelH-40);

  // Exporta como blob PNG (transparente)
  cv.toBlob(async(blob)=>{
    if(!blob){notify('Erro ao gerar imagem.');return;}
    const file=new File([blob],'treino-loadup.png',{type:'image/png'});
    // Tenta compartilhamento nativo com arquivo
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Meu treino',text:'Treino concluído no LoadUp 💪'}); return; }
      catch(e){ if(e&&e.name==='AbortError')return; /* cai para download */ }
    }
    // Fallback: baixar a imagem
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='treino-loadup.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    notify('Imagem salva! 📲');
  },'image/png');
}


function buildPickerResults(){

  });

  if(pickerEquip)results=results.filter(r=>r.equip===pickerEquip);

  function highlight(name){

          '</div>'+
          (isAdd
            ? '<div class="pk-check'+(sel?' on':'')+'">'+(sel?'✓':'')+'</div>'
            : '<div class="ex-list-arrow" style="color:var(--gold)">+</div>')+
        '</div>';
      }).join('')
    : '<div class="empty">Nenhum exercício encontrado'+(q?' para<br><span style="color:var(--gold)">"'+esc(pickerSearch)+'"</span>':'.')+'</div>';

  const countTxt='<div style="padding:8px 16px 4px"><div style="font-size:10px;color:var(--t3);letter-spacing:2px">'+results.length+' exercício'+(results.length!==1?'s':'')+'</div></div>';

function buildExecMode(r){
  const exs=r.exercises.filter(e=>e.name);
  if(!exs.length){workoutMode=false;return buildRoutinePage();}
  const idx=Math.min(workoutExIdx,exs.length-1);
  const ex=exs[idx];
  const cfg=ALL_EX_MAP[ex.name];
  const groupColor=cfg?Object.values(CATALOG).find(g=>g.exercises.find(e=>e.name===ex.name))?.color||'var(--gold)':'var(--gold)';
  const sug=getSuggestion(ex.name);
  const lastSets=getLastSession(ex.name);
  const doneKey=r.id+'_'+ex.id;
  if(!window._setsDone)window._setsDone={};
  const doneArr=window._setsDone[doneKey]||[];
  const pct=Math.round((idx/exs.length)*100);
  const plateau=getPlateauStatus(ex.name);
  const miniChart=buildMiniChart(ex.name,groupColor);
  const doneSets=doneArr.filter(Boolean).length;
  const totalSets=ex.sets.length;
  const isLast=idx===exs.length-1;
  const isFirst=idx===0;

  let workNum=0;
  const setsHtml=ex.sets.map((s,si)=>{
    const t=s.type||'valida';
    const done=doneArr[si]===true;
    const last=lastSets&&lastSets[si]?lastSets[si]:null;
    const lastTxt=last?((last.reps||last.weight)?(last.reps||'?')+'×'+(last.weight||0)+'kg':'—'):'—';
    let typeLabel,typeColor;
    if(t==='aquecimento'){typeLabel='W';typeColor='#3498db';}
    else if(t==='dropset'){typeLabel='D';typeColor='#9b59b6';}
    else if(t==='falha'){typeLabel='F';typeColor='#e74c3c';}
    else if(t==='preparatoria'){typeLabel='P';typeColor='#888';}
    else if(t==='backoff'){typeLabel='BO';typeColor='#1abc9c';}
    else if(t==='cluster'){typeLabel='CS';typeColor='#e67e22';}
    else if(t==='restpause'){typeLabel='RP';typeColor='#e84393';}
    else {workNum++;typeLabel=String(workNum);typeColor='var(--gold)';}
    if(t==='cluster'){
      return '<div style="margin-bottom:12px" data-si="'+si+'">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;padding:0 12px">'+
          '<button class="exec-set-num set-type-tap" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" style="background:none;border:none;cursor:pointer;padding:0">'+
            '<div class="exec-set-idx" style="color:#e67e22">'+
              'CS'+
            '</div>'+
            '<div class="exec-prev-ref">'+lastTxt+'</div>'+
          '</button>'+
        '</div>'+
        buildClusterBlocksHtml(s,ex.id,r.id,si)+
      '</div>';
    }
    if(t==='restpause'){
      return '<div style="margin-bottom:12px" data-si="'+si+'">'+
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;padding:0 12px">'+
          '<button class="exec-set-num set-type-tap" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" style="background:none;border:none;cursor:pointer;padding:0">'+
            '<div class="exec-set-idx" style="color:#e84393">RP</div>'+
            '<div class="exec-prev-ref">'+lastTxt+'</div>'+
          '</button>'+
        '</div>'+
        buildRestPauseBlocksHtml(s,ex.id,r.id,si)+
      '</div>';
    }
    return '<div class="exec-set-row '+(done?'done-row':'')+'" data-si="'+si+'">'+
      '<button class="exec-set-num set-type-tap" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" style="background:none;border:none;cursor:pointer;padding:0">'+
        '<div class="exec-set-idx" style="color:'+(done?'#2a2a2a':typeColor)+'">'+
          typeLabel+
        '</div>'+
        '<div class="exec-prev-ref">'+lastTxt+'</div>'+
      '</button>'+
      '<div class="stepper-wrap">'+
        '<button class="stepper-btn step-btn" data-field="reps" data-delta="-1" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" aria-label="menos reps">−</button>'+
        '<input type="number" class="stepper-inp sr" placeholder="'+(sug?sug.reps:12)+'" value="'+esc(s.reps)+
          '" inputmode="numeric" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'"/>'+
        '<button class="stepper-btn step-btn" data-field="reps" data-delta="1" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" aria-label="mais reps">+</button>'+

        '<input type="number" class="stepper-inp sw" placeholder="'+(sug?sug.weight:0)+'" value="'+esc(s.weight)+
          '" inputmode="decimal" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'"/>'+
        '<button class="stepper-btn step-btn" data-field="weight" data-delta="2.5" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+'" aria-label="mais peso">+</button>'+
      '</div>'+
      '<button class="exec-confirm-btn '+(done?'done':'')+
        '" data-exid="'+ex.id+'" data-rid="'+r.id+'" data-si="'+si+
        '" data-donekey="'+doneKey+'" data-exname="'+esc(ex.name)+'">'+(done?icon('undo',18):icon('check',20))+'</button>'+
    '</div>';
  }).join('');

  // Next exercise preview
  const nextEx=!isLast?exs[idx+1]:null;
  const nextPreview=nextEx?
    '<div style="margin-top:16px;padding:10px 12px;background:#0a0a0a;border-radius:10px;border:1px solid #111;display:flex;align-items:center;gap:10px">'+

    '</div>'+

    '<div class="exec-progress"><div class="exec-progress-fill" style="width:'+pct+'%"></div></div>'+
    // Body
    '<div class="exec-body" id="exec-body">'+
      '<div class="exec-exname">'+esc(ex.name)+'</div>'+
      (cfg?'<div class="exec-muscles">'+
        '<span class="muscle-tag muscle-primary">'+cfg.primary+'</span>'+
        Object.keys(cfg.contrib).filter(m=>m!==cfg.primary).slice(0,2).map(m=>'<span class="muscle-tag">'+m+'</span>').join('')+
      '</div>':'')+

// ── CLUSTER BLOCK HELPERS ──────────────────────────
function getClusterParts(scheme){
  // e.g. '3x3' → {n:3, reps:3}
  const m=(scheme||'3x3').match(/^(\d+)x(\d+)$/);
  return m?{n:parseInt(m[1]),reps:parseInt(m[2])}:{n:3,reps:3};
}
function ensureClusterBlocks(s){
  // Ensure s.clusterBlocks matches the current scheme
  const parts=getClusterParts(s.cluster||'3x3');
  if(!s.clusterBlocks||s.clusterBlocks.length!==parts.n){
    s.clusterBlocks=Array.from({length:parts.n},(_,i)=>({
      reps:parts.reps,
      weight:parseFloat(s.weight)||0
    }));
  }
  return s.clusterBlocks;
}
function buildClusterBlocksHtml(s,exid,rid,si){
  const parts=getClusterParts(s.cluster||'3x3');
  const blocks=ensureClusterBlocks(s);
  const totalReps=blocks.reduce((a,b)=>a+(parseFloat(b.reps)||0),0);
  const avgWeight=blocks.reduce((a,b)=>a+(parseFloat(b.weight)||0),0)/blocks.length;

// ── REST PAUSE BLOCK HELPERS ───────────────────────
// Rest Pause: mini-séries dentro da mesma série, com 15s de descanso entre cada.
// Reaproveita s.clusterBlocks como armazenamento (a série tem type==='restpause').
function ensureRestPauseBlocks(s){
  if(!s.clusterBlocks||!s.clusterBlocks.length){
    // começa com 2 mini-séries por padrão
    s.clusterBlocks=[
      {reps:s.reps||'',weight:parseFloat(s.weight)||0},
      {reps:'',weight:parseFloat(s.weight)||0}
    ];
  }
  return s.clusterBlocks;
}

}
// Atualiza ao vivo a seção "MÚSCULOS NESTE TREINO" e o VOL total (sem re-render, preserva foco)
function refreshWorkoutMuscles(){
  const wrap=document.getElementById('workout-mvol');
  if(!wrap)return; // só existe na página de rotina (não em modo execução)
  const r=S.routines.find(x=>x.id===wrap.dataset.rid);
  if(!r)return;
  const mvol=getMuscleVolume(r.exercises);
  const sorted=Object.entries(mvol).sort((a,b)=>b[1]-a[1]);
  const maxV=Math.max(...sorted.map(x=>x[1]),1);
  wrap.innerHTML=buildBars(sorted,maxV);
  const totEl=document.getElementById('workout-totalvol');
  if(totEl)totEl.textContent=calcTotalVol(r.exercises).toFixed(1)+' kg';
}

// ── Gráfico de progressão de CARGA SEMANAL (todos os treinos ou um específico) ──
function buildWeeklyLoadSection(){
  // Nomes de treinos que aparecem no histórico
  const routineNames=[...new Set(S.log.map(l=>l.routineName).filter(Boolean))].sort();
  // Se o treino selecionado não existe mais no histórico, volta para "todos"
  if(wkLoadRoutine!=='__all__'&&!routineNames.includes(wkLoadRoutine))wkLoadRoutine='__all__';
  const filter=wkLoadRoutine==='__all__'?null:wkLoadRoutine;
  const NWEEKS=8;
  const trend=getWeeklyVolumeTrend(NWEEKS,filter);
  const hasData=trend.some(w=>w.vol>0);
  const maxVol=Math.max(...trend.map(w=>w.vol),1);
  // Tendência: compara última semana com volume > 0 contra a anterior com volume > 0
  const nz=trend.filter(w=>w.vol>0);
  let pctStr='—',pctColor='#888';
  if(nz.length>=2){
    const a=nz[nz.length-2].vol,b=nz[nz.length-1].vol;
    if(a>0){const p=((b-a)/a)*100;pctStr=(p>=0?'▲ +':'▼ ')+p.toFixed(1)+'%';pctColor=p>=0?'#4caf50':'#e74c3c';}
  }
  const sel='<select class="chart-ex-select" id="wkload-sel" style="margin-bottom:12px">'+
    '<option value="__all__"'+(wkLoadRoutine==='__all__'?' selected':'')+'>Todos os treinos</option>'+
    routineNames.map(n=>'<option value="'+esc(n)+'"'+(n===wkLoadRoutine?' selected':'')+'>'+esc(n)+'</option>').join('')+
  '</select>';
  const chart=hasData?
    '<div class="wkload-bars">'+
      trend.map(w=>{
        const h=w.vol>0?Math.max(Math.round((w.vol/maxVol)*70),4):2;
        const isCur=w.w===0;
        const color=isCur?'var(--gold)':'#2a2a2a';
        const tc=isCur?'var(--gold)':'var(--t3)';
        const kLabel=w.vol>0?(w.vol>=1000?Math.round(w.vol/1000)+'k':Math.round(w.vol)):'';
        return '<div class="wkload-col">'+
          '<div class="wkload-val" style="color:'+tc+'">'+kLabel+'</div>'+
          '<div class="wkload-bar-bg"><div class="wkload-bar-fill" style="height:'+h+'px;background:'+color+'"></div></div>'+
          '<div class="wkload-lbl" style="color:'+tc+'">'+w.label+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="rcard mt8" style="justify-content:space-between">'+
      '<span class="td txs">Tendência (carga semanal)</span>'+
      '<span style="font-size:14px;font-weight:800;color:'+pctColor+'">'+pctStr+'</span>'+
    '</div>'
    :'<div class="chart-empty">Registre treinos em semanas diferentes<br>para ver a progressão de carga 📈</div>';
  return '<div class="px16" style="padding-top:14px">'+
    '<div class="sec-title" style="padding:0 0 10px">CARGA SEMANAL</div>'+
    sel+chart+
    '<div class="divider" style="margin-top:14px"></div>'+
  '</div>';
}

          <div style="display:flex;gap:6px;flex-wrap:wrap;width:100%">
            ${[100,95,90,85,80,75,70,65].map(pct=>{

              <div style="flex:1;min-width:70px;background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:8px 6px;text-align:center">

function buildMuscles(){
  const ms=weekTab===0?getWeekMSets():getAllMSets();
  const sorted=Object.entries(ms).sort((a,b)=>b[1]-a[1]);
  const maxS=Math.max(...sorted.map(x=>x[1]),1);
  const goals=S.weeklyGoals||{};

  // Weekly volume trend (last 6 weeks)
  const wvolTrend=getWeeklyVolumeTrend(6);
  const maxVol=Math.max(...wvolTrend.map(w=>w.vol),1);
  const wvolHtml=wvolTrend.some(w=>w.vol>0)?
    '<div class="sec"><div class="sec-hdr"><span class="sec-title">VOLUME SEMANAL</span>'+
      '<span style="font-size:9px;color:var(--t3);letter-spacing:1px">últimas 6 semanas</span></div>'+
      '<div class="wvol-bar-row">'+
        wvolTrend.map((w,i)=>{
          const h=w.vol>0?Math.max(Math.round((w.vol/maxVol)*48),4):2;
          const isCurrent=w.w===0;
          const color=isCurrent?'var(--gold)':'#2a2a2a';
          const textColor=isCurrent?'var(--gold)':'var(--t3)';
          return '<div class="wvol-bar-col">'+
            (w.vol>0?'<div class="wvol-val" style="color:'+textColor+'">'+Math.round(w.vol/1000)+'k</div>':'<div class="wvol-val"></div>')+
            '<div class="wvol-bar-bg2" style="height:52px">'+
              '<div class="wvol-bar-fill2" style="height:'+h+'px;background:'+color+'"></div>'+
            '</div>'+
            '<div class="wvol-lbl" style="color:'+textColor+'">'+w.label+'</div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div><div class="divider"></div>':
    '';

  // Predicted training days
  const predDays=getPredictedDays();
  const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const todayDow=new Date().getDay();
  const predHtml=predDays.length>0?
    '<div class="sec"><div class="sec-hdr"><span class="sec-title">DIAS HABITUAIS</span>'+
      '<span style="font-size:9px;color:var(--t3);letter-spacing:1px">baseado no histórico</span></div>'+
      '<div class="pred-days">'+
        dayNames.map((d,i)=>{
          const isPred=predDays.includes(i);
          const isToday=i===todayDow;
          const bg=isToday&&isPred?'var(--gold)':isPred?'#1c1200':isToday?'#0a0a0a':'transparent';
          const color=isToday&&isPred?'#000':isPred?'var(--gold)':isToday?'var(--t2)':'#333';
          const border=isPred||isToday?'1px solid '+(isPred?'var(--gold)':'#333'):'1px solid #1a1a1a';
          return '<div class="pred-day" style="background:'+bg+';color:'+color+';border:'+border+'">'+d+'</div>';
        }).join('')+
      '</div>'+
    '</div><div class="divider"></div>':
    '';

  function buildGoalBars(sortedEntries){
    const allMuscles=new Set([...sortedEntries.map(([m])=>m),...Object.keys(goals)]);
    const rows=[...allMuscles].map(m=>{
      const done=Math.round(ms[m]||0);
      const goal=goals[m]||0;
      const color=MUSCLE_COLORS[m]||'var(--gold)';
      const icon=MUSCLE_ICONS[m]||'';
      const pct=goal>0?Math.min(Math.round((done/goal)*100),100):null;
      const overGoal=goal>0&&done>=goal;
      return'<div class="goal-row">'+
        '<div class="mvol-icon" style="color:'+color+'">'+icon+'</div>'+
        '<div class="goal-bar-wrap" style="min-width:0;flex:1">'+
          '<div style="display:flex;justify-content:space-between;align-items:center">'+
            '<span style="font-size:13px;font-weight:700;color:'+(overGoal?'#4caf50':'var(--text)')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+m+'</span>'+
            '<span style="font-size:11px;color:'+(overGoal?'#4caf50':color)+';font-weight:700;margin-left:6px;white-space:nowrap">'+
              done+(goal>0?' / '+goal+' séries'+(overGoal?' ✓':''):'série'+(done!==1?'s':''))+
            '</span>'+
          '</div>'+
          (goal>0?
            '<div class="goal-bar-bg"><div class="goal-bar-fill" style="width:'+pct+'%;background:'+(overGoal?'#4caf50':color)+'"></div></div>'+
            '<div class="goal-pct" style="color:'+(overGoal?'#4caf50':color)+'">'+pct+'%</div>':
            '<div class="goal-bar-bg"><div class="goal-bar-fill" style="width:'+Math.round((done/maxS)*100)+'%;background:'+color+'"></div></div>')+
        '</div>'+
        (weekTab===0?'<button class="goal-set-btn set-goal-btn" data-muscle="'+esc(m)+'" data-current="'+goal+'">'+(goal>0?icon('edit',12)+' Meta':'+ Meta')+'</button>':'')+
      '</div>';
    });
    return rows.join('');
  }

  return'<div class="page pb80">'+
  '<div class="hdr"><div class="hdr-title">MÚSCULOS</div><div class="td txs">'+(weekTab===0?'7 DIAS':'ESTE MÊS')+'</div></div>'+
  '<div class="tabs"><button class="tab '+(weekTab===0?'active':'')+'" id="tw0">ESTA SEMANA</button><button class="tab '+(weekTab===1?'active':'')+'" id="tw1">ESTE MÊS</button></div>'+
  (weekTab===0?buildDeloadCard():'')+
  (weekTab===0?wvolHtml:'')+
  (weekTab===0?buildWeeklyLoadSection():'')+

// Gráfico de linha (zig-zag) simples, em SVG, para a evolução de peso.
// Direto ao ponto: só a linha, os pontos e o essencial — sem barras espaçadas.
function buildWeightLineChart(wh){
  const W=300,H=72,padL=4,padR=4,padT=10,padB=16;
  const recent=wh.slice(-12);
  const weights=recent.map(e=>e.weight);
  const maxW=Math.max(...weights),minW=Math.min(...weights);
  const range=(maxW-minW)||1;
  const n=recent.length;
  const x=i=>padL+(n<=1?(W-padL-padR)/2:(i/(n-1))*(W-padL-padR));
  const y=w=>padT+(H-padT-padB)*(1-(w-minW)/range);
  const pts=recent.map((e,i)=>[x(i),y(e.weight)]);
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>{
    const isLast=i===pts.length-1;
    return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(isLast?3.5:2)+'" fill="'+(isLast?'#fff':'var(--gold)')+'"'+(isLast?' stroke="var(--gold)" stroke-width="1.5"':'')+'/>';
  }).join('');
  const firstD=new Date(recent[0].date),lastD=new Date(recent[recent.length-1].date);
  const fmt=d=>('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:72px;display:block;overflow:visible">'+
    '<line x1="'+padL+'" y1="'+(H-padB+0.5)+'" x2="'+(W-padR)+'" y2="'+(H-padB+0.5)+'" stroke="#1a1a1a" stroke-width="1"/>'+
    '<polyline points="'+poly+'" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+
    (n>1?'<text x="'+padL+'" y="'+H+'" font-size="8" fill="#666" font-family="Barlow,sans-serif">'+fmt(firstD)+'</text>'+
      '<text x="'+(W-padR)+'" y="'+H+'" font-size="8" fill="#666" font-family="Barlow,sans-serif" text-anchor="end">'+fmt(lastD)+'</text>':'')+
  '</svg>';
}

function dayKey(d){d=new Date(d);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function getStrengthDays(){
  const days=new Set();
  S.log.forEach(l=>days.add(dayKey(l.date)));
  return days;
}
function getCardioDays(){
  const days=new Set();
  (S.cardioLog||[]).forEach(c=>days.add(dayKey(c.date)));
  return days;
}
// Dias com QUALQUER atividade (musculação OU cardio) — usado para streak e marcação
function getWorkoutDays(){
  const days=new Set();
  S.log.forEach(l=>days.add(dayKey(l.date)));
  (S.cardioLog||[]).forEach(c=>days.add(dayKey(c.date)));
  return days;
}
function getStreak(){
  const days=getWorkoutDays();let streak=0;
  const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(today.getDate()-i);
    if(days.has(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`))streak++;
    else if(i>0)break;
  }
  return streak;
}
function getLongestStreak(){
  if(!S.log.length)return 0;
  const days=[...getWorkoutDays()].map(k=>{const[y,m,d]=k.split('-');return new Date(parseInt(y),parseInt(m),parseInt(d))}).sort((a,b)=>a-b);
  let best=1,cur=1;
  for(let i=1;i<days.length;i++){
    const diff=(days[i]-days[i-1])/(1000*60*60*24);
    if(diff===1){cur++;best=Math.max(best,cur);}else cur=1;
  }
  return days.length?best:0;
}
function getTotalHours(){
  // Estima ~1h por treino se não houver dado de duração real
  return(S.stats.totalWorkouts*1).toFixed(0);
}

function buildCalendar(){
  const now=new Date();
  const todayY=now.getFullYear(),todayM=now.getMonth(),todayD=now.getDate();
  const wdays=getWorkoutDays();
  const sdays=getStrengthDays();
  const cdays=getCardioDays();
  const streak=getStreak();const longest=getLongestStreak();
  const labels=['D','S','T','Q','Q','S','S'];

  // Generate all months from May 2024 to current month
  const START_YEAR=2024,START_MONTH=4; // May = index 4
  const months=[];
  let y=START_YEAR,m=START_MONTH;
  while(y<todayY||(y===todayY&&m<=todayM)){
    months.push({y,m});
    m++;if(m>11){m=0;y++;}
  }

  // Build each month block
  const monthNames=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  let blocksHtml='';
  for(const {y:my,m:mm} of months){
    const firstDay=new Date(my,mm,1).getDay();
    const daysInMonth=new Date(my,mm+1,0).getDate();
    const workoutsThisMonth=[...wdays].filter(k=>k.startsWith(`${my}-${mm}-`)).length;

    let cells='';
    // Empty cells before first day
    for(let i=0;i<firstDay;i++) cells+=`<div class="cal-c cx"></div>`;
    // Day cells
    for(let d=1;d<=daysInMonth;d++){
      const key=`${my}-${mm}-${d}`;
      const isToday=d===todayD&&mm===todayM&&my===todayY;
      const hasStrength=sdays.has(key);
      const hasCardio=cdays.has(key);
      let cls;
      if(hasStrength&&hasCardio)cls='cd cd-both';
      else if(hasStrength)cls='cd';
      else if(hasCardio)cls='cd cd-cardio';
      else if(isToday)cls='ct';
      else cls='ce';
      cells+=`<div class="cal-c ${cls}">${d}</div>`;
    }

    blocksHtml+=`
    <div class="cal-month-block">
      <div class="cal-month-label">
        ${monthNames[mm]} ${my}
        ${workoutsThisMonth>0?`<span>${workoutsThisMonth} treino${workoutsThisMonth>1?'s':''}</span>`:'<span style="color:#333">—</span>'}
      </div>
      <div class="cal-week-labels">${labels.map(l=>`<div class="cal-week-lbl">${l}</div>`).join('')}</div>
      <div class="cal-month-grid">${cells}</div>
    </div>`;
  }

  return`<div class="page pb80" style="display:flex;flex-direction:column;overflow:hidden">
  <div class="hdr" style="padding-bottom:4px;flex-shrink:0">
    <div class="hdr-title">CALENDÁRIO</div>
    <div class="td txs">${todayD}/${todayM+1}/${todayY}</div>
  </div>

  <!-- Stats row -->
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;padding:0 10px 6px;flex-shrink:0">
    <div class="stat-card" style="padding:7px 4px">
      <div class="stat-val" style="font-size:18px;line-height:1.1">${streak}</div>
      <div class="stat-lbl" style="font-size:9px">SEQUÊNCIA</div>
    </div>
    <div class="stat-card" style="padding:7px 4px">
      <div class="stat-val" style="font-size:18px;line-height:1.1">${longest}</div>
      <div class="stat-lbl" style="font-size:9px">RECORDE</div>
    </div>
    <div class="stat-card" style="padding:7px 4px">
      <div class="stat-val" style="font-size:18px;line-height:1.1">${S.stats.totalWorkouts}</div>
      <div class="stat-lbl" style="font-size:9px">TREINOS</div>
    </div>
    <div class="stat-card" style="padding:7px 4px">
      <div class="stat-val" style="font-size:18px;line-height:1.1">${wdays.size}</div>
      <div class="stat-lbl" style="font-size:9px">DIAS</div>
    </div>
  </div>

  ${streak>=3?`<div class="streak-bar" style="margin:0 10px 6px;flex-shrink:0">
    <div class="streak-num">${streak}</div>
    <div class="f1">
      <div style="font-size:11px;font-weight:800;color:var(--gold)">${streak>=30?'IMPARÁVEL! 🔥':streak>=14?'ELITE 💪':streak>=7?'1 SEMANA! ⚡':'EM SEQUÊNCIA!'}</div>
      <div style="font-size:9px;color:var(--t3);margin-top:1px">${streak} dias consecutivos</div>
    </div>
  </div>`:''}

  <!-- Legenda -->
  <div style="display:flex;gap:12px;padding:0 10px 4px;flex-shrink:0;align-items:center;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:var(--gold)"></div><span style="font-size:9px;color:var(--t3)">Treino</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:#e8554e"></div><span style="font-size:9px;color:var(--t3)">Cardio</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--gold) 50%,#e8554e 50%)"></div><span style="font-size:9px;color:var(--t3)">Ambos</span></div>
    <div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:2px;border:1.5px solid var(--gold)"></div><span style="font-size:9px;color:var(--t3)">Hoje</span></div>
  </div>

  <!-- Scroll contínuo de meses -->
  <div class="cal-scroll" id="cal-scroll-area">
    ${blocksHtml}
  </div>

  </div>`;
}

// ══════════════════════════════════════════════════
// CARDIO
// ══════════════════════════════════════════════════
function fmtCardioTime(sec){
  sec=Math.max(0,Math.round(sec));
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(h>0)return h+':'+('0'+m).slice(-2)+':'+('0'+s).slice(-2);
  return m+':'+('0'+s).slice(-2);
}
function buildCardio(){
  if(cardioSession)return buildCardioSession();
  const recent=(S.cardioLog||[]).slice(0,30);
  const weekCut=startOfWeek();
  const prevWeekCut=weekCut-7*86400000;
  const weekSessions=(S.cardioLog||[]).filter(c=>new Date(c.date).getTime()>=weekCut);
  const prevWeekSessions=(S.cardioLog||[]).filter(c=>{const t=new Date(c.date).getTime();return t>=prevWeekCut&&t<weekCut});
  const weekMin=Math.round(weekSessions.reduce((a,c)=>a+(c.seconds||0),0)/60);
  const prevWeekMin=Math.round(prevWeekSessions.reduce((a,c)=>a+(c.seconds||0),0)/60);
  const weekCal=weekSessions.reduce((a,c)=>a+(c.calories||0),0);
  // Comparação direta com a semana passada: mais útil que só o total isolado.
  let trendHtml='';
  if(prevWeekMin>0){
    const diffPct=Math.round(((weekMin-prevWeekMin)/prevWeekMin)*100);
    const up=diffPct>0;
    trendHtml=diffPct===0?'':'<span style="color:'+(up?'#4caf50':'#e74c3c')+';font-weight:700">'+(up?'▲':'▼')+' '+Math.abs(diffPct)+'%</span> vs. semana passada';
  }else if(weekMin>0){
    trendHtml='primeira semana com cardio registrado';
  }
  const histHtml=recent.length?recent.map(c=>{
    const t=cardioTypeById(c.typeId);
    const d=new Date(c.date);
    const dd=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2);
    const bits=[];
    bits.push(fmtCardioTime(c.seconds||0));
    if(c.distance)bits.push(c.distance+(t.distUnit||'km'));
    if(c.bpm)bits.push(c.bpm+' bpm');
    if(c.calories)bits.push(c.calories+' kcal');
    if(c.rpe)bits.push('RPE '+c.rpe);
    if(c.hiit)bits.push('HIIT');
    return '<div class="cardio-hist-card cardio-hist-edit" data-cardio-edit="'+c.id+'">'+
      '<div class="cardio-hist-ico">'+cardioIcon(c.typeId,28)+'</div>'+
      '<div class="f1" style="min-width:0">'+
        '<div style="font-size:14px;font-weight:700;color:var(--text)">'+esc(t.name)+'</div>'+
        '<div style="font-size:11px;color:var(--t3);margin-top:2px">'+bits.join(' · ')+'</div>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--t3);flex-shrink:0">'+dd+'</div>'+
    '</div>';
  }).join(''):'<div class="empty"><div class="empty-ico">❤️</div><div class="empty-title">Nenhum cardio ainda</div><div class="empty-sub">Toque em + para registrar<br>sua primeira sessão de cardio</div></div>';

  return`<div class="page pb80">
  <div class="hdr"><div class="hdr-title">CARDIO</div></div>
  <div class="px16" style="display:flex;gap:8px;margin-bottom:6px">
    <div class="stat-card f1"><div class="stat-val">${weekMin}</div><div class="stat-lbl">MIN SEMANA</div></div>
    <div class="stat-card f1"><div class="stat-val">${weekSessions.length}</div><div class="stat-lbl">SESSÕES</div></div>
    <div class="stat-card f1"><div class="stat-val">${weekCal}</div><div class="stat-lbl">KCAL</div></div>
  </div>
  ${trendHtml?`<div class="px16" style="margin-bottom:12px"><div style="font-size:11px;color:var(--t3);text-align:center">${trendHtml}</div></div>`:'<div class="mt8"></div>'}
  <div class="px16" style="display:flex;gap:8px">
    <button class="btn-gold f1" id="cardio-new">+ INICIAR</button>
    <button class="btn-dark f1" id="cardio-manual" style="display:inline-flex;align-items:center;justify-content:center;gap:6px">${icon('edit',15)} Manual</button>
  </div>
  <div class="sec mt16">
    <div class="px16">${histHtml}</div>
  </div>
  </div>
  ${cardioTypePicker?buildCardioTypePicker():''}
  ${cardioEditId!==null?buildCardioEditForm():''}`;
}

  const t=cardioTypeById(cardioSession.typeId);
  // Tela de escolha do modo (cronômetro x timer)
  if(cardioSession._choosingMode){

          </button>`).join('')}

          </button>

        <div style="text-align:center"><div style="display:flex;justify-content:center">${cardioIcon(t.id,40)}</div><div style="font-size:13px;font-weight:800;letter-spacing:1px;color:var(--gold);margin-top:2px">${esc(t.name).toUpperCase()}</div></div>
        <div style="width:40px"></div>
      </div>
      <div style="padding:24px 20px;display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center">
        <div style="text-align:center;font-size:13px;color:var(--t2);margin-bottom:6px">Como você quer medir o tempo?</div>
        <button class="cardio-mode-btn" id="cmode-cron"><span style="font-size:30px">⏱️</span><div><div class="cmode-title">Cronômetro</div><div class="cmode-sub">Conta do zero pra cima</div></div></button>
        <button class="cardio-mode-btn" id="cmode-timer"><span style="font-size:30px">⏳</span><div><div class="cmode-title">Timer</div><div class="cmode-sub">Conta pra baixo a partir de um alvo</div></div></button>

  let display,sub;
  if(isDown){

function buildHiitSession(t){
  const h=cardioSession.hiit;
  const phase=h.phase; // 'work' | 'rest'
  const remain=cardioRunning?Math.max(0,Math.round((cardioEndAt-Date.now())/1000)):h._pausedRemain;
  const phaseColor=phase==='work'?'#e8554e':'#3498db';
  const phaseLabel=phase==='work'?'TRABALHO 🔥':'DESCANSO 😮‍💨';
  return`<div class="cardio-session" style="background:${phase==='work'?'#1a0c0a':'#0a1118'}">
    <div class="cardio-session-top">
      <button class="cardio-back" id="cardio-cancel-session" aria-label="Fechar sessão">${icon('close',18)}</button>
      <div style="text-align:center"><div style="display:flex;justify-content:center;align-items:center;gap:4px">${cardioIcon(t.id,34)}<span style="font-size:22px">⚡</span></div><div style="font-size:12px;font-weight:800;letter-spacing:1px;color:var(--gold);margin-top:2px">HIIT · ${esc(t.name).toUpperCase()}</div></div>
      <div style="width:40px"></div>
    </div>
    <div class="cardio-clock-wrap">
      <div style="font-size:14px;font-weight:900;letter-spacing:3px;color:${phaseColor};margin-bottom:4px">${phaseLabel}</div>
      <div class="cardio-clock" id="cardio-clock" style="color:${phaseColor}">${fmtCardioTime(remain)}</div>
      <div class="cardio-clock-sub">ROUND ${h.round} / ${h.totalRounds}</div>
      <div style="display:flex;gap:5px;margin-top:14px;flex-wrap:wrap;justify-content:center;max-width:240px">
        ${Array.from({length:h.totalRounds},(_,i)=>`<div style="width:12px;height:12px;border-radius:50%;background:${i<h.round-1?'var(--gold)':i===h.round-1?phaseColor:'#2a2a2a'}"></div>`).join('')}
      </div>
    </div>
    <div class="cardio-controls">
      ${cardioRunning
        ? `<button class="btn-dark f1" id="cardio-pause">⏸ PAUSAR</button>`
        : `<button class="btn-gold f1" id="cardio-play">▶ ${h._started?'CONTINUAR':'INICIAR'}</button>`}
      <button class="btn-dark" id="cardio-reset" style="flex:0 0 auto;padding-left:18px;padding-right:18px" aria-label="Zerar cronômetro">↺</button>
    </div>
    <button class="btn-gold" id="cardio-finish" style="width:auto;margin:18px 16px 0">✓ FINALIZAR HIIT</button>
  </div>`;
}
function buildCardioFinishForm(){
  const t=cardioTypeById(cardioSession.typeId);
  let secs;
  if(cardioSession.mode==='hiit'){
    const h=cardioSession.hiit;
    // tempo decorrido = rounds completos × (work+rest), aproximado
    const doneRounds=h._done?h.totalRounds:Math.max(0,h.round-1);
    secs=doneRounds*(h.work+h.rest)+(h.phase==='rest'?h.work:0);
  }else{
    secs=cardioSession.mode==='down'
      ? cardioSession.target-Math.max(0,Math.round((cardioEndAt-Date.now())/1000))
      : cardioElapsed;
  }
  cardioSession._finalSecs=Math.max(0,secs);
  const hasProfile=(S.user&&S.user.profile&&S.user.profile.weight);
  const distRow=t.dist?`<div class="cardio-field">
    <label>Distância (${t.distUnit})</label>
    <input type="number" id="cf-dist" inputmode="decimal" placeholder="0" class="cardio-input"/>
  </div>`:'';
  const calHint=hasProfile
    ? '<div style="font-size:10px;color:var(--t3);margin-top:3px">Calculado automaticamente. Preencha os batimentos para mais precisão.</div>'
    : '<div style="font-size:10px;color:#c9a23a;margin-top:3px">💡 Preencha seus dados físicos no Perfil para cálculo automático.</div>';
  return'<div class="sheet-overlay" id="cardio-finish-ov">'+
    '<div class="sheet">'+
      '<div class="sheet-handle"></div>'+
      '<div class="sheet-title">REGISTRAR · '+esc(t.name).toUpperCase()+'</div>'+
      '<div style="text-align:center;margin-bottom:14px"><div style="font-size:28px;font-weight:800;color:var(--gold);font-family:\'Oswald\',sans-serif">'+fmtCardioTime(cardioSession._finalSecs)+'</div><div style="font-size:10px;color:var(--t3);letter-spacing:2px">TEMPO TOTAL</div></div>'+

function cardioTick(){
  if(!cardioSession)return;
  if(cardioSession.mode==='hiit'){return hiitTick();}
  if(cardioSession.mode==='down'){
    const remain=Math.max(0,Math.round((cardioEndAt-Date.now())/1000));
    const el=document.getElementById('cardio-clock');
    const sub=document.getElementById('cardio-clock-sub');
    if(el)el.textContent=fmtCardioTime(remain);
    if(remain<=0&&!cardioFired){
      cardioFired=true;
      if(sub)sub.textContent='TEMPO ESGOTADO! 🔥';
      try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);}catch{}
      const fl=document.createElement('div');fl.className='timer-glow';document.body.appendChild(fl);setTimeout(()=>fl.remove(),2400);
      cardioPause();
    }
  }else{
    cardioElapsed=Math.round((Date.now()-cardioStartAt)/1000);
    const el=document.getElementById('cardio-clock');
    if(el)el.textContent=fmtCardioTime(cardioElapsed);
  }
}
function cardioPlay(){
  if(cardioRunning||!cardioSession)return;
  cardioRunning=true;
  if(cardioSession.mode==='hiit'){
    const h=cardioSession.hiit;h._started=true;
    const remain=h._pausedRemain!=null?h._pausedRemain:(h.phase==='work'?h.work:h.rest);
    cardioEndAt=Date.now()+remain*1000;cardioFired=false;
    clearInterval(cardioInterval);cardioInterval=setInterval(cardioTick,250);
    render();return;
  }
  if(cardioSession.mode==='down'){
    const remain=cardioSession._pausedRemain!=null?cardioSession._pausedRemain:cardioSession.target;
    cardioEndAt=Date.now()+remain*1000;cardioFired=false;
  }else{
    cardioStartAt=Date.now()-cardioElapsed*1000;
  }
  clearInterval(cardioInterval);cardioInterval=setInterval(cardioTick,250);
  render();
}
function cardioPause(){
  cardioRunning=false;clearInterval(cardioInterval);
  if(cardioSession&&cardioSession.mode==='down'){
    cardioSession._pausedRemain=Math.max(0,Math.round((cardioEndAt-Date.now())/1000));
  }
  if(cardioSession&&cardioSession.mode==='hiit'){
    cardioSession.hiit._pausedRemain=Math.max(0,Math.round((cardioEndAt-Date.now())/1000));
  }
  render();
}
function cardioReset(){
  clearInterval(cardioInterval);cardioRunning=false;cardioElapsed=0;cardioFired=false;
  if(cardioSession){
    cardioStartAt=Date.now();
    cardioSession._pausedRemain=cardioSession.target;
    if(cardioSession.mode==='down')cardioEndAt=Date.now()+cardioSession.target*1000;
    if(cardioSession.mode==='hiit'){
      const h=cardioSession.hiit;
      h.phase='work';h.round=1;h._started=false;h._pausedRemain=h.work;h.totalElapsed=0;
    }
  }
  render();
}
// Lógica do HIIT: alterna trabalho/descanso, conta rounds, sinaliza transições
function hiitTick(){
  const h=cardioSession.hiit;
  const remain=Math.max(0,Math.round((cardioEndAt-Date.now())/1000));
  const el=document.getElementById('cardio-clock');
  if(el)el.textContent=fmtCardioTime(remain);
  if(remain<=0){
    // Transição de fase
    if(h.phase==='work'){
      // termina trabalho → descanso (ou fim se último round e sem descanso após)
      h.phase='rest';
      cardioEndAt=Date.now()+h.rest*1000;
      try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch{}
      flashHiit('#3498db');
      render();
    }else{
      // termina descanso → próximo round ou fim
      if(h.round>=h.totalRounds){
        // Fim do HIIT
        cardioRunning=false;clearInterval(cardioInterval);
        try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);}catch{}
        const fl=document.createElement('div');fl.className='timer-glow';document.body.appendChild(fl);setTimeout(()=>fl.remove(),2400);
        h._done=true;
        render();
        return;
      }
      h.round++;h.phase='work';
      cardioEndAt=Date.now()+h.work*1000;
      try{if(navigator.vibrate)navigator.vibrate([200,80,200]);}catch{}
      flashHiit('#e8554e');
      render();
    }
  }
}
function flashHiit(color){
  const fl=document.createElement('div');
  fl.style.cssText='position:fixed;inset:0;z-index:9500;pointer-events:none;background:'+color+';opacity:.35;transition:opacity .5s';
  document.body.appendChild(fl);
  requestAnimationFrame(()=>{fl.style.opacity='0';});
  setTimeout(()=>fl.remove(),600);
}
function startHiit(typeId,work,rest,rounds){
  cardioSession={typeId,mode:'hiit',hiit:{work,rest,totalRounds:rounds,round:1,phase:'work',_started:false,_pausedRemain:work,_done:false}};
  cardioRunning=false;cardioFired=false;cardioTypePicker=false;
  render();
}
function startCardioSession(typeId,mode,targetSecs){
  cardioSession={typeId,mode,target:targetSecs||0,_pausedRemain:targetSecs||0};
  cardioElapsed=0;cardioRunning=false;cardioFired=false;
  cardioStartAt=Date.now();
  if(mode==='down')cardioEndAt=Date.now()+(targetSecs||0)*1000;
  cardioTypePicker=false;
  render();
}
let _cardioRpe=0;
function bindCardioFinish(){
  _cardioRpe=0;
  const close=()=>{document.getElementById('cardio-finish-wrap')?.remove();};
  // Auto-cálculo de calorias
  const calField=document.getElementById('cf-cal');
  const bpmField=document.getElementById('cf-bpm');
  let calEditedManually=false;
  const recalc=()=>{
    if(calEditedManually)return;
    const bpm=parseInt(bpmField?.value)||0;
    const est=estimateCardioCalories({typeId:cardioSession.typeId,seconds:cardioSession._finalSecs||0,bpm});
    if(est&&calField)calField.value=est;
  };
  // Pré-preenche ao abrir (se houver dados físicos)
  recalc();
  bpmField?.addEventListener('input',recalc);
  calField?.addEventListener('input',()=>{calEditedManually=true;});
  document.getElementById('cardio-finish-cancel')?.addEventListener('click',close);
  document.getElementById('cardio-finish-ov')?.addEventListener('click',e=>{if(e.target.id==='cardio-finish-ov')close();});
  document.querySelectorAll('#cf-rpe-row .rpe-dot').forEach(d=>d.addEventListener('click',()=>{
    _cardioRpe=parseInt(d.dataset.rpe);
    document.querySelectorAll('#cf-rpe-row .rpe-dot').forEach(x=>x.classList.toggle('on',parseInt(x.dataset.rpe)<=_cardioRpe));
  }));
  document.getElementById('cardio-save')?.addEventListener('click',()=>{
    const t=cardioTypeById(cardioSession.typeId);
    const dist=t.dist?parseFloat(document.getElementById('cf-dist')?.value)||0:0;
    const bpm=parseInt(document.getElementById('cf-bpm')?.value)||0;
    const cal=parseInt(document.getElementById('cf-cal')?.value)||0;
    const entry={
      id:Date.now().toString()+Math.random().toString(36).slice(2),
      typeId:cardioSession.typeId,
      date:new Date().toISOString(),
      seconds:cardioSession._finalSecs||0,
      distance:dist||null,
      bpm:bpm||null,
      calories:cal||null,
      rpe:_cardioRpe||null,
      hiit:cardioSession.mode==='hiit'?{work:cardioSession.hiit.work,rest:cardioSession.hiit.rest,rounds:cardioSession.hiit.totalRounds}:null,
    };
    if(!S.cardioLog)S.cardioLog=[];
    S.cardioLog.unshift(entry);
    save(S);
    close();
    clearInterval(cardioInterval);cardioSession=null;cardioRunning=false;cardioElapsed=0;
    notify('Cardio salvo! ❤️');render();
  });
}

function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

// ── DRAG REORDER ──────────────────────────────────
// ══════════════════════════════════════════════════
// MOTOR DE REORDENAÇÃO UNIFICADO (drag & drop)
// Usado tanto para exercícios quanto para rotinas. Recursos:
//  • hit-test pelo ponto médio do card mais próximo (não exige acerto exato)
//  • reordenação AO VIVO: os cards abrem espaço conforme você arrasta
//  • auto-scroll ao chegar perto das bordas (listas longas)
//  • feedback tátil (vibração) ao pegar e ao trocar de posição
//  • preserva a posição de rolagem ao soltar
// ══════════════════════════════════════════════════
function makeReorderable(opts){
  // opts: {itemSelector, handleSelector, getList, onReorder, onDragStart, onDragEnd}
  const cards=[...document.querySelectorAll(opts.itemSelector)];
  if(cards.length<2)return;
  const vibe=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

  cards.forEach((card,idx)=>{
    const handle=opts.handleSelector?card.querySelector(opts.handleSelector):card;
    if(!handle)return;

    let startY=0, curIdx=idx, lastOverIdx=idx, scrollTimer=null, scroller=null, startScroll=0;

    function getScroller(){
      if(!scroller)scroller=card.closest('.page')||document.scrollingElement||document.documentElement;
      return scroller;
    }
    // Descobre o índice do card mais próximo do dedo (pelo centro de cada card)
    function nearestIndex(clientY){
      let best=curIdx, bestDist=Infinity;
      cards.forEach((c,i)=>{
        const rect=c.getBoundingClientRect();
        const mid=rect.top+rect.height/2;
        const d=Math.abs(clientY-mid);
        if(d<bestDist){bestDist=d;best=i;}
      });
      return best;
    }

    // Marca visualmente onde o item vai cair
    function markOver(overIdx){
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(overIdx!==curIdx&&cards[overIdx])cards[overIdx].classList.add('drag-over');
    }

    // Aplica o transform de flutuação compensando o quanto a lista já rolou
    function floatTo(clientY){
      const sc=getScroller();
      const scrollDelta=(sc?sc.scrollTop:0)-startScroll;
      card.style.transform='translateY('+((clientY-startY)+scrollDelta)+'px) scale(1.03) rotate(-1deg)';
    }

    // Auto-scroll quando o dedo chega perto do topo/base da tela
    function edgeScroll(clientY){
      const sc=getScroller();
      const margin=90, speed=12;
      const vh=window.innerHeight;
      let dir=0;
      if(clientY<margin)dir=-1;
      else if(clientY>vh-margin)dir=1;
      if(dir!==0&&!scrollTimer){
        scrollTimer=setInterval(()=>{ if(sc){sc.scrollTop+=dir*speed;floatTo(clientY);markOver(nearestIndex(clientY));} },16);
      }else if(dir===0&&scrollTimer){ clearInterval(scrollTimer);scrollTimer=null; }
    }
    function stopEdgeScroll(){ if(scrollTimer){clearInterval(scrollTimer);scrollTimer=null;} }

    function endDrag(){
      stopEdgeScroll();
      card.classList.remove('dragging');
      card.style.transform='';
      card.style.pointerEvents='';
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(opts.onDragEnd)opts.onDragEnd();
    }

    // ── TOUCH ──
    handle.addEventListener('touchstart',e=>{
      e.stopPropagation();
      startY=e.touches[0].clientY;
      startScroll=getScroller()?getScroller().scrollTop:0;
      curIdx=cards.indexOf(card);lastOverIdx=curIdx;
      card.classList.add('dragging');
      card.style.pointerEvents='none';
      if(opts.onDragStart)opts.onDragStart();
      vibe(12);
    },{passive:true});

    handle.addEventListener('touchmove',e=>{
      e.preventDefault();
      const y=e.touches[0].clientY;
      floatTo(y);
      const over=nearestIndex(y);
      if(over!==lastOverIdx){ markOver(over); lastOverIdx=over; vibe(6); }
      edgeScroll(y);
    },{passive:false});

    handle.addEventListener('touchend',e=>{
      e.stopPropagation();
      const y=e.changedTouches[0].clientY;
      const targetIdx=nearestIndex(y);
      endDrag();
      if(targetIdx>=0&&targetIdx!==curIdx){ vibe([8,20,8]); opts.onReorder(curIdx,targetIdx); }
    },{passive:true});

    // Toque cancelado (notificação, gesto do sistema): desfaz o estado sem reordenar
    handle.addEventListener('touchcancel',e=>{ endDrag(); },{passive:true});

    // ── MOUSE (desktop) ──
    handle.setAttribute('draggable','true');
    handle.addEventListener('dragstart',e=>{
      curIdx=cards.indexOf(card);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      if(opts.onDragStart)opts.onDragStart();
    });
    card.addEventListener('dragover',e=>{
      e.preventDefault();e.dataTransfer.dropEffect='move';
      const over=cards.indexOf(card);
      markOver(over);
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();
      cards.forEach(c=>c.classList.remove('drag-over'));
      const targetIdx=cards.indexOf(card);
      if(targetIdx>=0&&targetIdx!==curIdx)opts.onReorder(curIdx,targetIdx);
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      cards.forEach(c=>c.classList.remove('drag-over'));
      if(opts.onDragEnd)opts.onDragEnd();
    });
  });
}

function bindDragReorder(){
  makeReorderable({
    itemSelector:'#exlist .excard',
    handleSelector:'.drag-handle',
    onDragStart:()=>document.body.classList.add('reordering-ex'),
    onDragEnd:()=>document.body.classList.remove('reordering-ex'),
    onReorder:(from,to)=>{
      // usa o rid do card em edição (todos os cards do #exlist pertencem à mesma rotina)
      const list=document.querySelectorAll('#exlist .excard');
      const rid=list[from]?.dataset.rid||list[0]?.dataset.rid;
      const r=S.routines.find(x=>x.id===rid);
      if(!r)return;
      const [moved]=r.exercises.splice(from,1);
      r.exercises.splice(to,0,moved);
      save(S);renderKeepScroll();
    }
  });
}

function bindRoutineReorder(){
  makeReorderable({
    itemSelector:'#routine-list .rrow',
    handleSelector:'.rrow-handle',
    onReorder:(from,to)=>{
      const [moved]=S.routines.splice(from,1);
      S.routines.splice(to,0,moved);
      save(S);renderKeepScroll();
    }
  });
}
function doCreateRoutine(){
  const id=Date.now().toString();const name=`Treino ${String.fromCharCode(65+S.routines.length)}`;
  S.routines.push({id,name,exercises:[]});S.stats.totalRoutines=S.routines.length;
  const earned=checkMedals(S.stats,S.medals);earned.forEach(m=>S.medals.push(m.id));
  save(S);activeRid=id;page='routine';if(earned.length)newMedals=earned;render();
}
function doFinish(){
  flushSave();
  window._setsDone={};window._expandedCards={};
  stopWorkoutTimer();
  const workoutDuration=_workoutElapsed;
  _workoutTimerRunning=false;_workoutElapsed=0;
  const r=S.routines.find(x=>x.id===activeRid);if(!r)return;
  const volume=calcTotalVol(r.exercises);let prCount=0;
  const prExercises=[];
  // Get previous workout of same routine for comparison
  const prevLog=S.log.find(l=>l.routineId===r.id);
  r.exercises.forEach(ex=>{if(!ex.name)return;
    let hitPR=false;
    // Só séries efetivas (não aquecimento/preparatória) contam pra PR —
    // uma série de aquecimento mais pesada não deveria "bater recorde".
    ex.sets.filter(isEffectiveSet).forEach(s=>{const w=parseFloat(s.weight)||0;if(w>0&&(!S.prs[ex.name]||w>S.prs[ex.name])){S.prs[ex.name]=w;prCount++;hitPR=true}});
    if(hitPR)prExercises.push(ex.name);
  });
  // séries válidas totais
  const validSets=r.exercises.reduce((a,ex)=>a+ex.sets.filter(isEffectiveSet).length,0);
  // Registra o treino no dia em que ele COMEÇOU, não em que terminou — evita que um
  // treino iniciado antes da meia-noite "vaze" pro dia seguinte no histórico/calendário.
  const logDate=_workoutStart?new Date(_workoutStart).toISOString():new Date().toISOString();
  S.log.unshift({id:Date.now().toString(),routineId:r.id,routineName:r.name,exercises:JSON.parse(JSON.stringify(r.exercises)),volume,date:logDate,duration:workoutDuration});
  S.stats.totalWorkouts++;S.stats.totalPRs+=prCount;S.stats.maxVolume=Math.max(S.stats.maxVolume,volume);
  const earned=checkMedals(S.stats,S.medals);earned.forEach(m=>S.medals.push(m.id));
  finishData={routineName:r.name,exercises:JSON.parse(JSON.stringify(r.exercises)),volume,prCount,prExercises,validSets,duration:workoutDuration,prevLog:prevLog?JSON.parse(JSON.stringify(prevLog)):null};
  S.activeSession=null;
  save(S);if(earned.length)newMedals=earned;page='finish';render();
  if(fbUser)cloudSave();
  // Feedback tátil: padrão comemorativo mais forte se bateu PR, suave se não
  try{navigator.vibrate&&navigator.vibrate(prCount>0?[40,60,40,60,80]:[30,50,30]);}catch(e){}
