// Retoma um treino em andamento se o app fechou/reiniciou antes de finalizar
// (protege contra fechamento acidental). Ignora sessões muito antigas (>12h)
// para não jogar o usuário de volta num treino que ele já esqueceu.
if(S.activeSession&&S.activeSession.routineId&&S.routines.find(r=>r.id===S.activeSession.routineId)){
  const sessAgeMs=S.activeSession.workoutStart?(Date.now()-S.activeSession.workoutStart):0;
  if(sessAgeMs>12*3600*1000){
    S.activeSession=null;save(S);
  }else{
    activeRid=S.activeSession.routineId;
    workoutExIdx=S.activeSession.exIdx||0;
    workoutMode=!!S.activeSession.workoutMode;
    window._setsDone=S.activeSession.setsDone||{};
    window._expandedCards=S.activeSession.expandedCards||{};
    page='routine';
    if(S.activeSession.workoutStart){
      _workoutStart=S.activeSession.workoutStart;
      _workoutElapsed=Math.floor((Date.now()-_workoutStart)/1000);
      _workoutTimerRunning=true;
      clearInterval(_workoutTimerInterval);
      _workoutTimerInterval=setInterval(()=>{
        _workoutElapsed=Math.floor((Date.now()-_workoutStart)/1000);
        const el=document.getElementById('workout-elapsed');
        if(el)el.textContent=formatWorkoutTime(_workoutElapsed);
      },1000);
    }
    setTimeout(()=>{try{notify('↩️ Treino retomado — seu progresso foi recuperado.');}catch(e){}},1600);
  }
}
render();
setTimeout(()=>{if(page==='splash'){page=S.user?'home':'register';if(S.user&&!S.seenTutorial)tutorialStep=0;render()}},1400);
// Detecta cedo (antes do usuário treinar achando que está tudo sendo salvo)
// se o armazenamento local não funciona — aba anônima/privada em alguns
// navegadores, ou quota já esgotada.
if(!testStorageAvailable()&&!window._saveWarned){
  window._saveWarned=true;
  setTimeout(()=>{
    openConfirm('Este navegador não está salvando dados','Não consegui gravar nada no armazenamento local (comum em aba anônima/privada). Seus treinos NÃO serão salvos neste modo. Use uma aba normal, ou exporte um backup no fim de cada sessão.',
      ()=>{},{okLabel:'Entendi',danger:true});
  },1800);
}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
// Recalcula o timer ao voltar de app minimizado/aba em segundo plano
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    // App indo para segundo plano (ou podendo ser encerrado pelo SO a qualquer
    // momento): grava agora, não espera o debounce — evita perder o que só
    // estava em memória (série marcada, exercício atual, cronômetro).
    try{syncActiveSession();flushSave();}catch(e){}
    return;
  }
  if(!document.hidden&&timerActive){
    // Recalcula imediatamente o tempo restante a partir do timestamp
    tickTimer();
    // Garante que o intervalo está rodando (alguns navegadores o pausam)
    if(!timerInterval||timerSecs>0){clearInterval(timerInterval);timerInterval=setInterval(tickTimer,250);}
  }
  // Cardio: recalcula o cronômetro/timer ao voltar de app minimizado
  if(!document.hidden&&cardioSession&&cardioRunning){
    cardioTick();
    clearInterval(cardioInterval);cardioInterval=setInterval(cardioTick,250);
  }
});
window.addEventListener('pageshow',()=>{if(timerActive)tickTimer();if(cardioSession&&cardioRunning)cardioTick();});
// Último recurso: alguns navegadores/PWAs disparam pagehide sem passar por
// visibilitychange ao fechar de fato — garante o mesmo flush aqui também.
window.addEventListener('pagehide',()=>{try{syncActiveSession();flushSave();}catch(e){}});

// ══════════════════════════════════════════════════
// SUÍTE DE TESTES INTERNA (chame runSelfTests() no console do navegador)
// Valida as funções críticas de cálculo. Não roda sozinha — não afeta o app.
// ══════════════════════════════════════════════════
window.runSelfTests=function(){
  const results=[];
  const eq=(name,got,exp)=>{const ok=JSON.stringify(got)===JSON.stringify(exp);results.push({name,ok,got,exp});};
  const near=(name,got,exp,tol)=>{const ok=Math.abs(got-exp)<=(tol||0.1);results.push({name,ok,got,exp});};
  // effectiveSetWeight
  eq('RIR conta 1 série',effectiveSetWeight({type:'valida'}),1);
  eq('Falha conta 1 série',effectiveSetWeight({type:'falha'}),1);
  eq('Cluster conta 1 série',effectiveSetWeight({type:'cluster'}),1);
  eq('Drop conta 1/2 série',effectiveSetWeight({type:'dropset'}),0.5);
  eq('RestPause conta 1/2 série',effectiveSetWeight({type:'restpause'}),0.5);
  eq('Aquecimento conta 0',effectiveSetWeight({type:'aquecimento'}),0);
  eq('Preparatória conta 0',effectiveSetWeight({type:'preparatoria'}),0);
  // calcSetVol
  eq('Volume simples 10x60=600',calcSetVol({reps:'10',weight:'60',type:'valida'}),600);
  eq('Volume vazio=0',calcSetVol({reps:'',weight:'',type:'valida'}),0);
  eq('Volume RestPause soma blocos',calcSetVol({type:'restpause',weight:'60',clusterBlocks:[{reps:'8',weight:'60'},{reps:'5',weight:'60'}]}),780);
  // calc1RM (Epley)
  eq('1RM com 1 rep = peso',calc1RM(100,1),100);
  near('1RM 100kg x5 ≈ 116.7',calc1RM(100,5),116.7,0.2);
  eq('1RM sem reps=0',calc1RM(100,0),0);
  // clamp de faixa (valores plausíveis)
  const clampReps=v=>{v=parseFloat(v);if(isNaN(v)||v<0)return 0;return Math.min(v,500);};
  eq('Reps clamp 9999→500',clampReps(9999),500);
  eq('Reps clamp negativo→0',clampReps(-5),0);
  // relatório
  const pass=results.filter(r=>r.ok).length, total=results.length;
  console.log('%c LoadUp — Testes internos: '+pass+'/'+total+' passaram','color:'+(pass===total?'#4caf50':'#e74c3c')+';font-weight:bold');
  results.forEach(r=>console.log((r.ok?'✓':'✗ FALHOU')+' '+r.name+(r.ok?'':' → obteve '+JSON.stringify(r.got)+', esperava '+JSON.stringify(r.exp))));
  return{pass,total,allPassed:pass===total,results};
};
</script>
