<title>LoadUp – Treino & Progressão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* ── Fluidez global (sem alterar estrutura) ── */
/* Remove o flash cinza e o atraso de 300ms ao tocar em qualquer elemento interativo */
button,a,input,select,textarea,[role=button],.nav-item,.set-num-btn,.stepper-btn,.timer-preset{
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Toque com resposta imediata: leve feedback de pressão em botões */
button:active,[role=button]:active{transform:scale(.97)}
/* Botões que já têm transform próprio no :active não devem conflitar */
.stepper-btn:active,.set-num-btn:active,.nav-item:active{transform:none}
/* Rolagem com inércia suave e sem "vazar" o scroll para a página */
.page,.sheet,.modal-scroll,[class*=scroll]{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* Isola o repaint de listas longas (cada card não força recalcular a tela toda) */
.excard,.cardio-hist-card,.hist-card,.goal-row,.medal-card{contain:layout style}
/* Overlays e folhas animam na GPU (transições mais macias) */
.sheet-overlay,.timer-overlay,.overlay,.modal-overlay,.timer-pill{will-change:transform,opacity}
:root{
  --gold:#f0c040;--gold-dk:#b8960c;--gold-faint:rgba(240,192,64,.08);
  --bg:#080808;--bg2:#101010;--bg3:#161616;--bg4:#1c1c1c;
  --border:#1e1e1e;--border2:#262626;
  --text:#fff;--t2:#aaa;--t3:#555;--danger:#c0392b;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
html{height:100%}
body{height:100%;height:100dvh;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;touch-action:manipulation;
  display:flex;flex-direction:column;overflow:hidden}
#root{
  flex:1;min-height:0;max-width:430px;width:100%;margin:0 auto;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden}
.page{
  flex:1;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-left:var(--sl);padding-right:var(--sr);background:var(--bg)}
#splash{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 38%,#1c1200 0%,var(--bg) 62%);padding-top:var(--st)}
.s-logo span{font-family:'Oswald',sans-serif;font-size:58px;font-weight:900;letter-spacing:6px}
.lo-w{color:#fff}.lo-g{color:var(--gold)}
.s-sub{color:var(--t3);font-size:10px;letter-spacing:7px;margin-top:4px;margin-bottom:48px}
.spinner{width:26px;height:26px;border:2px solid #1e1e1e;border-top-color:var(--gold);border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  padding-top:calc(var(--st)+24px);padding-bottom:calc(var(--sb)+24px);
  background:radial-gradient(ellipse at 50% 28%,#1c1200 0%,var(--bg) 62%)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%}
.clogo .big{font-family:'Oswald',sans-serif;font-size:42px;font-weight:900;letter-spacing:5px}
.clogo .sub{color:var(--t3);font-size:10px;letter-spacing:5px;margin-top:4px;text-align:center}
.clogo{text-align:center;margin-bottom:32px}
label{display:block;color:var(--gold);font-size:10px;letter-spacing:3px;font-weight:700;margin-bottom:8px}
input[type=text],input[type=number]{width:100%;background:#0a0a0a;border:1px solid var(--border2);
  border-radius:10px;color:var(--text);padding:13px 14px;font-size:16px;font-family:'Barlow',sans-serif;
  outline:none;transition:border-color .2s}
input:focus{border-color:var(--gold)}
input::placeholder{color:#262626}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.btn-gold{display:block;width:100%;background:linear-gradient(135deg,var(--gold-dk),var(--gold) 55%,#ffd968);
  color:#000;border:none;border-radius:13px;padding:15px;font-weight:900;font-size:15px;
  letter-spacing:2px;cursor:pointer;font-family:'Oswald',sans-serif;transition:opacity .15s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 16px rgba(240,192,64,.22),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-gold:active{opacity:.9;transform:scale(.98);box-shadow:0 2px 8px rgba(240,192,64,.18)}
.btn-gold:disabled{opacity:.3;box-shadow:none}
.btn-dark{display:block;width:100%;background:none;color:var(--t3);border:1px solid var(--border2);
  border-radius:13px;padding:13px;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;transition:border-color .15s,color .15s}
.btn-dark:active{border-color:var(--gold);color:var(--gold)}
.btn-sg{background:linear-gradient(135deg,var(--gold-dk),var(--gold) 60%,#ffd968);color:#000;border:none;
  border-radius:8px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;
  box-shadow:0 2px 8px rgba(240,192,64,.18),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-sg:active{opacity:.85;transform:scale(.97)}
.btn-sd{background:var(--bg3);color:var(--t2);border:1px solid var(--border2);border-radius:7px;padding:7px 11px;font-size:13px;cursor:pointer}
/* Botões de ação com ícone SVG: centralização consistente */
.btn-sg svg,.btn-sd svg{display:block}
.rrow .btn-sg,.rrow .btn-sd{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px}
.btn-back{background:none;border:none;color:var(--gold);font-size:13px;letter-spacing:1px;cursor:pointer;padding:0;font-family:'Barlow',sans-serif;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.btn-icon{background:none;border:none;cursor:pointer;padding:0}
.btn-add{background:none;border:1px solid var(--gold);color:var(--gold);padding:5px 13px;border-radius:7px;font-size:11px;cursor:pointer;letter-spacing:1px;font-weight:700}
.hdr{display:flex;justify-content:space-between;align-items:center;
  padding:18px 16px 13px;
  padding-top:calc(var(--st) + 18px);
  border-bottom:1px solid #0f0f0f;position:sticky;top:0;background:var(--bg);z-index:10}
.hdr-greet{font-size:20px;font-weight:800;font-family:'Oswald',sans-serif;letter-spacing:1px}
.hdr-sub{color:var(--t3);font-size:10px;letter-spacing:3px;margin-top:2px}
.hdr-title{font-size:20px;font-weight:900;font-family:'Oswald',sans-serif;letter-spacing:3px;color:var(--gold)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dk),var(--gold));
  display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:16px;
  font-family:'Oswald',sans-serif;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-lg{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dk),var(--gold));
  border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;
  color:#000;font-weight:900;font-size:36px;font-family:'Oswald',sans-serif;margin:0 auto 8px;
  overflow:hidden;cursor:pointer;position:relative}
.avatar-lg img{width:100%;height:100%;object-fit:cover}
.avatar-lg .cam-ov{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:opacity .2s}
.avatar-lg:hover .cam-ov,.avatar-lg:active .cam-ov{opacity:1}
.stats-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 16px}
.stat-card{background:linear-gradient(160deg,#141414,#0d0d0d);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03)}
.stat-val{font-size:26px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--gold);line-height:1}
.stat-lbl{font-size:9px;color:var(--t3);letter-spacing:2px;margin-top:4px}
.sec{padding:16px 0 0}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px}
.sec-title{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold)}
.rcard{display:flex;align-items:center;gap:12px;background:linear-gradient(165deg,#131313,#0e0e0e);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:0 16px 8px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.rname{font-size:15px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px}
.rsub{font-size:11px;color:var(--t3);margin-top:2px;letter-spacing:1px}

/* ── EXERCISE PICKER MODAL ── */
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:9996;display:flex;flex-direction:column}
.picker-hdr{display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  padding-top:calc(var(--st) + 14px);
  border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.picker-hdr-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px;color:var(--gold);flex:1}
.picker-search{flex:1;background:#0a0a0a;border:1px solid var(--border2);border-radius:8px;color:var(--text);
  padding:9px 12px;font-size:15px;font-family:'Barlow',sans-serif;outline:none}
.picker-search:focus{border-color:var(--gold)}
.picker-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Group grid */
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.group-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:14px 10px;
  cursor:pointer;text-align:center;transition:border-color .2s,background .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.group-btn:active{background:var(--bg3);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.group-btn .gb-icon{width:48px;height:48px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .2s}
.group-btn:active .gb-icon{transform:scale(1.07)}
.group-btn .gb-icon svg{width:48px;height:48px;display:block}
.group-btn .gb-name{font-size:11px;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:1px;color:var(--t2)}
.group-btn .gb-count{font-size:9px;color:var(--t3);margin-top:2px;letter-spacing:.5px}
/* Exercise list inside group */
.ex-list-item{display:flex;align-items:center;gap:11px;padding:13px 16px;
  border-bottom:1px solid #0d0d0d;cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent}
.ex-list-item:active{background:var(--bg2)}
.ex-list-item.selected{background:rgba(240,192,64,.07)}
.ex-list-name{font-size:14px;font-weight:600;color:var(--text);overflow-wrap:anywhere;word-break:break-word}
.ex-list-muscles{font-size:10px;color:var(--t3);margin-top:2px;letter-spacing:.5px}
.ex-list-arrow{color:var(--t3);font-size:16px;flex-shrink:0;margin-left:8px}
.picker-back{background:none;border:none;color:var(--gold);font-size:22px;cursor:pointer;padding:0;line-height:1}
/* Picker filter chips */
.pk-chips-row{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.pk-chips-row::-webkit-scrollbar{display:none}
.pk-chip{flex-shrink:0;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:18px;
  color:var(--t3);font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:6px 13px;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:'Barlow',sans-serif}
.pk-chip:active{transform:scale(.95)}
.pk-chip.on{background:var(--gold);border-color:var(--gold);color:#000}
/* Multi-select checkmark */
.pk-check{width:26px;height:26px;border-radius:50%;border:2px solid #2a2a2a;flex-shrink:0;margin-left:8px;
  display:flex;align-items:center;justify-content:center;color:#000;font-size:14px;font-weight:900;transition:all .15s}
.pk-check.on{background:var(--gold);border-color:var(--gold)}
/* Add bar (multi-select footer) */
.pk-add-bar{position:absolute;bottom:0;left:0;right:0;
  background:rgba(8,8,8,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid #1a1a1a;padding:14px 16px;padding-bottom:calc(14px + var(--sb));z-index:10}
.pk-ex-ico svg{width:18px;height:18px}

/* EXERCISE CARD */
.excard{background:linear-gradient(165deg,#121212,#0d0d0d);border:1px solid #1c1800;border-radius:16px;padding:14px;margin:0 16px 10px;box-shadow:0 3px 14px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.025)}
.excard.ex-collapsed{padding:10px 14px}
.ex-collapse-btn{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  border-radius:8px;-webkit-tap-highlight-color:transparent;line-height:1}
.ex-collapse-btn:active{background:#1a1a1a;color:var(--gold)}
.ex-collapsed-row{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ex-collapsed-check{width:28px;height:28px;border-radius:50%;background:#0d1f0d;border:2px solid #2e7d32;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#4caf50}
.ex-collapsed-name{flex:1;min-width:0;font-size:14px;font-weight:700;font-family:'Oswald',sans-serif;color:#4caf50;letter-spacing:.5px;
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.2}
.ex-collapsed-sets{font-size:10px;color:#2e7d32;letter-spacing:1px;white-space:nowrap}
.ex-collapsed-expand{font-size:11px;color:#333;letter-spacing:1px;background:none;border:1px solid #1a1a1a;border-radius:6px;padding:4px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.muscle-tag{display:inline-flex;align-items:center;background:var(--gold-faint);border:1px solid rgba(240,192,64,.2);
  border-radius:20px;padding:3px 9px;font-size:10px;color:var(--gold);letter-spacing:1px;margin:2px 3px 2px 0}
.muscle-primary{background:rgba(240,192,64,.15);border-color:rgba(240,192,64,.4)}
.set-grid{display:grid;grid-template-columns:26px 1fr 1fr 32px 26px;gap:5px}
.set-grid5{display:grid;grid-template-columns:22px 1fr 1fr 1fr 32px;gap:4px;align-items:center}
/* Hevy-style 5-col: SÉRIE | ANT | REPS | PESO | ✓ */
.set-grid6{display:grid;grid-template-columns:30px 38px 1fr 1fr 28px;gap:4px;align-items:center}
.btn-confirm-set{background:var(--bg3);border:1px solid #333;border-radius:8px;color:#555;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;height:36px;width:30px;transition:background .15s,color .15s;flex-shrink:0}
.btn-confirm-set:active{background:#1a2e1a;border-color:#4caf50;color:#4caf50}
.btn-confirm-set.done{background:#0d1f0d;border-color:#2e7d32;color:#4caf50}
.set-last-cell{font-size:10px;color:#666;text-align:center;letter-spacing:.3px;white-space:nowrap;overflow:hidden;padding:2px 2px}
.set-hdr{font-size:9px;color:var(--t3);letter-spacing:1.5px;text-align:center;padding-bottom:4px}
.set-num{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:13px;font-weight:700}
/* Tappable set number button (opens type sheet) */
.set-num-btn{background:linear-gradient(160deg,#121212,#0b0b0b);border:1.5px solid #242424;border-radius:10px;height:36px;width:100%;
  font-size:14px;font-weight:800;font-family:'Oswald',sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.set-num-btn:active{transform:scale(.92);border-color:var(--gold)}
/* Add set button */
.add-set-btn{width:100%;background:#0d0d0d;border:1px dashed #2a2a2a;border-radius:9px;
  color:var(--t2);font-size:12px;font-weight:700;letter-spacing:1px;padding:10px;margin-top:8px;
  cursor:pointer;transition:all .15s;font-family:'Barlow',sans-serif}
.add-set-btn:active{background:#141414;border-color:var(--gold);color:var(--gold)}
/* Exercise menu button (⋯) */
.ex-menu-btn{background:none;border:none;color:var(--t2);font-size:22px;cursor:pointer;
  flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;line-height:1;transition:background .15s}
.ex-menu-btn:active{background:var(--bg3)}
/* Exercise note */
.ex-note{background:#0e0c00;border:1px solid #2a2200;border-radius:8px;padding:8px 10px;
  font-size:12px;color:#c9b86a;margin-bottom:10px;cursor:pointer;line-height:1.4}
.ex-note:active{border-color:var(--gold)}
/* Swipe-to-delete set row */
.set-row-sw{position:relative;touch-action:pan-y}
.set-in{background:#0a0a0a;border:1px solid #222;border-radius:7px;color:var(--text);padding:8px 4px;font-size:16px;text-align:center;font-family:'Barlow',sans-serif;width:100%}
.set-in:focus{border-color:var(--gold);outline:none}
.btn-rm{background:none;border:none;color:#2a2a2a;cursor:pointer;font-size:14px;padding:0;display:flex;align-items:center;justify-content:center}
.btn-timer-set{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--gold);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;height:100%;width:100%}
.ex-vol-bar{height:3px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.ex-vol-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold));border-radius:2px}
.suggest-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(184,212,0,.10),rgba(184,212,0,.03));border:1px solid rgba(184,212,0,.25);
  border-radius:10px;padding:6px 11px;font-size:11px;color:#c8e800;letter-spacing:.3px;margin-top:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
/* ABA DE EVOLUÇÃO DO EXERCÍCIO */
.evo-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:#0a0a0a;
  border:1px solid var(--border2);border-radius:9px;padding:9px 12px;margin:8px 0 0;cursor:pointer;
  font-size:11px;font-weight:700;color:var(--t2);letter-spacing:.5px;font-family:'Barlow',sans-serif;
  -webkit-tap-highlight-color:transparent}
.evo-toggle:active{border-color:var(--gold)}
.evo-toggle.open{border-color:var(--border2);border-bottom-left-radius:0;border-bottom-right-radius:0;color:var(--gold)}
.evo-panel{background:#0a0a0a;border:1px solid var(--border2);border-top:none;border-radius:0 0 9px 9px;padding:10px 12px 12px;margin-bottom:4px}
.evo-mtabs{display:flex;gap:6px;margin-bottom:8px}
.evo-mtab{flex:1;background:#111;border:1px solid #222;border-radius:7px;color:var(--t3);font-size:11px;
  font-weight:700;padding:6px 4px;cursor:pointer;font-family:'Barlow',sans-serif;-webkit-tap-highlight-color:transparent}
.evo-mtab.active{background:#1a1200;border-color:var(--gold);color:var(--gold)}
/* EX NAME BUTTON (replaces input) */
.ex-name-btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:#0a0a0a;
  border:1px solid var(--border2);border-radius:8px;padding:10px 12px;cursor:pointer;
  font-size:14px;font-family:'Barlow',sans-serif;color:var(--text);text-align:left;transition:border-color .2s;gap:8px}
.ex-name-btn:active{border-color:var(--gold)}
.ex-name-btn .enb-text{flex:1;font-size:14px;font-weight:600;min-width:0;text-align:left;
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.25}
.ex-name-btn .enb-hint{font-size:11px;color:var(--t3)}
.ex-name-btn .enb-change{font-size:10px;color:var(--gold);letter-spacing:1px;white-space:nowrap;flex-shrink:0}

/* MUSCLE VOLUME */
.mvol-wrap{padding:0 16px}
.mvol-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mvol-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mvol-icon svg{width:20px;height:20px;display:block}
.mvol-info{flex:1;min-width:0}
.mvol-name{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvol-kg{font-size:11px;color:var(--t3);margin-top:1px}
.mvol-bar-wrap{width:80px;flex-shrink:0}
.mvol-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.mvol-bar-fill{height:100%;border-radius:3px}
.mvol-pct{font-size:10px;color:var(--gold);text-align:right;margin-top:2px;letter-spacing:1px}

/* TABS */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:11px 8px;font-size:11px;letter-spacing:2px;font-weight:700;
  cursor:pointer;border:none;background:none;color:var(--t3);border-bottom:2px solid transparent;transition:color .2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* FINISH */
.fin-hero{background:linear-gradient(160deg,#1c1200,#0e0900);padding:calc(var(--st)+36px) 24px 24px;text-align:center;border-bottom:1px solid #2a1e00}
.fin-icon{font-size:58px;margin-bottom:10px}
.fin-title{font-size:30px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--gold);letter-spacing:4px}
.fin-sub{color:var(--t3);font-size:12px;letter-spacing:3px;margin-top:6px}

/* MEDALS redesign */
.medal-card{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.medal-card.locked{opacity:.32}
.progress-track{background:var(--border);border-radius:4px;height:4px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold));border-radius:4px}
.medal-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.medal-dot.earned{background:var(--gold)}
.medal-dot.locked-dot{background:#1e1e1e;border:1px solid #2a2a2a}

/* CALENDAR */
.cal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 8px}
.cal-month-block{margin-bottom:18px}
.cal-month-label{font-size:11px;font-weight:800;font-family:'Oswald',sans-serif;letter-spacing:2px;color:var(--t2);text-transform:uppercase;padding:10px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.cal-month-label span{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:1px}
.cal-week-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-week-lbl{font-size:9px;color:#777;text-align:center;font-weight:700;letter-spacing:.5px}
.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-c{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Oswald',sans-serif}
.cal-c.cd{background:var(--gold);color:#000;font-weight:900}
.cal-c.cd-cardio{background:#e8554e;color:#fff}
.cal-c.cd-both{background:linear-gradient(135deg,var(--gold) 50%,#e8554e 50%);color:#000}
.cal-c.ct{border:1.5px solid var(--gold);color:var(--gold)}
.cal-c.ce{color:#2a2a2a}
.cal-c.cx{}
.streak-bar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:0 0 6px}
.streak-num{font-size:22px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--gold);line-height:1;min-width:28px}

/* BOTTOM NAV */
.bnav{
  position:fixed;
  bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(8,8,8,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid #141414;display:flex;justify-content:space-around;
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  z-index:100}
.nav-item{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 6px;min-width:52px;color:inherit}
.nav-item:active{opacity:.55}
.nav-item svg{width:20px;height:20px;display:block}
.nav-lbl{font-size:8px;letter-spacing:.5px;font-weight:700}
.nav-on{color:var(--gold)}.nav-off{color:#303030}

/* NOTIFICATION */
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;font-family:'Barlow',sans-serif;cursor:pointer;width:100%}
.btn-google:active{opacity:.85}
.notif{position:fixed;top:calc(var(--st)+10px);left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,var(--gold-dk),var(--gold) 55%,#ffd968);color:#000;
  padding:11px 24px;border-radius:30px;font-weight:800;font-size:13px;letter-spacing:1px;
  z-index:9999;max-width:340px;text-align:center;
  box-shadow:0 6px 28px rgba(240,192,64,.28),0 2px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
  animation:slideDown .3s ease}
.update-bar{position:fixed;bottom:calc(72px + var(--sb));left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:398px;background:#0a1a00;border:1px solid #2a5000;
  border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:200;
  animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* OVERLAY / MODALS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9998;padding:24px}
.mmodal{background:var(--bg2);border:1px solid #2a1e00;border-radius:22px;padding:36px 28px;max-width:320px;width:100%;text-align:center;position:relative;overflow:hidden;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.mglow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:240px;height:240px;background:radial-gradient(circle,rgba(240,192,64,.18) 0%,transparent 70%);pointer-events:none}
.mbadge{font-size:10px;color:var(--gold);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}

/* TIMER */
.timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9997;padding:32px}
.timer-ring{position:relative;width:200px;height:200px;margin-bottom:24px}
.timer-ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.bg-circle{fill:none;stroke:#1a1a1a;stroke-width:8}
.fg-circle{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-seconds{font-size:56px;font-weight:900;font-family:'Oswald',sans-serif;color:var(--gold);line-height:1}
.timer-label{font-size:11px;color:var(--t3);letter-spacing:3px;margin-top:4px}
.timer-title{font-size:13px;color:var(--t2);letter-spacing:3px;margin-bottom:8px}
.timer-ex{font-size:17px;font-weight:800;font-family:'Oswald',sans-serif;color:#fff;margin-bottom:24px;text-align:center}
.timer-btns{display:flex;gap:12px;width:100%;max-width:280px}
.timer-presets{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.timer-preset{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--t2);padding:6px 14px;font-size:13px;cursor:pointer;font-family:'Barlow',sans-serif;font-weight:700}
.timer-preset.active{background:#1a1200;border-color:var(--gold);color:var(--gold)}

/* CHART */
.chart-canvas-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 12px;overflow:hidden}
canvas.chart{width:100%;height:160px;display:block}
.chart-empty{text-align:center;color:#6a6a6a;padding:32px 16px;font-size:13px}
.chart-ex-select{background:#0a0a0a;border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Barlow',sans-serif;width:100%;outline:none;margin-bottom:10px;-webkit-appearance:none}
.chart-ex-select:focus{border-color:var(--gold)}

/* INSTALL */
.install-bar{position:fixed;bottom:calc(var(--sb)+70px);left:50%;transform:translateX(-50%);
  background:#120e00;border:1px solid #3a2c00;border-radius:14px;padding:12px 16px;
  max-width:390px;width:calc(100% - 32px);display:flex;align-items:center;gap:12px;
  z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(18px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* WORKOUT EXECUTION MODE */
.exec-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;overflow:hidden;max-width:430px;left:50%;transform:translateX(-50%)}
.exec-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;padding-top:calc(var(--st)+14px);
  border-bottom:1px solid #111;flex-shrink:0;background:var(--bg);gap:8px}
.exec-hdr-center{flex:1;text-align:center;min-width:0}
.exec-progress{height:4px;background:var(--border);flex-shrink:0}
.exec-progress-fill{height:100%;background:linear-gradient(90deg,var(--gold-dk),var(--gold));transition:width .5s ease}
.exec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 140px;touch-action:pan-y}
.exec-exname{font-family:'Oswald',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;color:var(--gold);margin:18px 0 6px;line-height:1.1;
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.exec-muscles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
/* Set rows in execution mode — bigger touch targets */
.exec-set-row{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 52px;
  gap:6px;align-items:center;
  margin-bottom:10px;padding:10px 12px;
  background:var(--bg2);border-radius:14px;border:1px solid var(--border);
  transition:opacity .2s,border-color .2s}
.exec-set-row.done-row{opacity:.4;border-color:#111}
.exec-set-row .set-in{
  font-size:22px;font-weight:700;height:52px;
  border-radius:10px;border:1px solid #2a2a2a;
  background:#0a0a0a;color:var(--text);
  text-align:center;font-family:'Barlow',sans-serif;
  min-width:0;width:100%;padding:4px}
.exec-set-row .set-in:focus{border-color:var(--gold);outline:none}
.exec-set-row.done-row .set-in{color:#2a2a2a}
.exec-confirm-btn{
  background:var(--bg3);border:1.5px solid #333;border-radius:10px;
  color:#555;font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  height:52px;width:52px;transition:background .15s,color .15s,border-color .15s;
  flex-shrink:0;touch-action:manipulation}
.exec-confirm-btn:active{background:#1a2e1a;border-color:#4caf50;color:#4caf50}
.exec-confirm-btn.done{background:#0d1f0d;border-color:#2e7d32;color:#4caf50}
.exec-set-num{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.exec-set-idx{font-size:15px;font-weight:700;color:var(--gold);font-family:'Oswald',sans-serif}
.exec-set-type{font-size:8px;letter-spacing:.5px;font-weight:700}
.exec-prev-ref{font-size:10px;color:#6a6a6a;text-align:center;margin-top:3px;letter-spacing:.3px}
/* Nome do exercício "A SEGUIR": até 2 linhas em telas estreitas, sem cortar cedo */
.next-ex-name{font-size:13px;font-weight:700;color:#555;flex:1;min-width:0;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere;word-break:break-word}
/* Bottom nav */
.exec-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(8,8,8,.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid #1a1a1a;
  padding:12px 16px;padding-bottom:calc(12px + var(--sb));
  display:flex;gap:10px;z-index:501}
.exec-nav button{min-height:52px;font-size:14px;font-weight:900;letter-spacing:1px;border-radius:14px}
/* Swipe hint animation */
@keyframes swipeHint{0%{opacity:0;transform:translateX(0)}30%{opacity:.5}60%{transform:translateX(8px)}100%{opacity:0;transform:translateX(0)}}
.swipe-hint{animation:swipeHint 1.5s ease 1s forwards;color:var(--t3);font-size:11px;letter-spacing:1px}
/* BOTTOM SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9990;
  display:flex;align-items:flex-end;justify-content:center;
  animation:sheetFade .2s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
@keyframes sheetFade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;background:#0e0e0e;border-top:1px solid #222;
  border-radius:22px 22px 0 0;padding:10px 16px calc(20px + var(--sb));
  animation:sheetUp .28s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:#333;border-radius:2px;margin:4px auto 14px}
.sheet-title{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;
  color:var(--t2);text-align:center;margin-bottom:14px;text-transform:uppercase}
.sheet-opt{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;
  padding:12px 6px;cursor:pointer;border-radius:12px;transition:background .12s;-webkit-tap-highlight-color:transparent}
.sheet-opt:active{background:#1a1a1a}
.sheet-opt.on{background:rgba(240,192,64,.06)}
.sheet-opt-ico{width:38px;height:38px;border-radius:10px;border:1.5px solid;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;font-family:'Oswald',sans-serif}
.sheet-opt-label{display:block;font-size:14px;font-weight:700;color:var(--text)}
.sheet-opt-desc{display:block;font-size:11px;color:var(--t3);margin-top:1px}
.sheet-divider{height:1px;background:#1a1a1a;margin:8px 0}
.sheet-cancel{width:100%;background:#161616;border:1px solid #252525;border-radius:12px;
  color:var(--t2);font-size:13px;font-weight:700;letter-spacing:1px;padding:13px;margin-top:10px;
  cursor:pointer;font-family:'Barlow',sans-serif}
.sheet-cancel:active{background:#1e1e1e}

/* ── ONBOARDING / TUTORIAL (mini-banners) ── */
.tut-box{width:100%;max-width:340px;margin:0 20px;background:linear-gradient(165deg,#161616,#0e0e0e);
  border:1.5px solid #2a2a2a;border-radius:22px;padding:30px 24px 22px;text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
  animation:tutPop .32s cubic-bezier(.16,1,.3,1)}
@keyframes tutPop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
.tut-ico{font-size:46px;line-height:1;margin-bottom:14px}
.tut-title{font-family:'Oswald',sans-serif;font-size:21px;font-weight:700;color:var(--gold);
  letter-spacing:.5px;margin-bottom:10px}
.tut-txt{font-size:14px;line-height:1.55;color:var(--t2);margin-bottom:20px}
.tut-dots{display:flex;justify-content:center;gap:7px;margin-bottom:20px}
.tut-dot{width:7px;height:7px;border-radius:50%;background:#333;transition:all .2s}
.tut-dot.on{background:var(--gold);width:20px;border-radius:4px}
.tut-actions{display:flex;gap:10px}
.tut-skip{flex:0 0 auto;background:none;border:1px solid var(--border2);color:var(--t3);
  border-radius:12px;padding:13px 20px;font-size:13px;font-weight:700;letter-spacing:1px;
  cursor:pointer;font-family:'Barlow',sans-serif;-webkit-tap-highlight-color:transparent;transition:all .15s}
.tut-skip:active{border-color:var(--t2);color:var(--t2)}
.tut-next{flex:1 1 0;background:linear-gradient(135deg,var(--gold-dk),var(--gold) 55%,#ffd968);
  color:#000;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;letter-spacing:1px;
  cursor:pointer;font-family:'Oswald',sans-serif;-webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 16px rgba(240,192,64,.22),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .1s,opacity .15s}
.tut-next:active{transform:scale(.98);opacity:.9}
.tut-count{font-size:11px;color:var(--t3);letter-spacing:1px;margin-top:14px}

/* MODAL CUSTOMIZADO */
.modal-box{width:100%;max-width:360px;margin:0 20px;background:#111;border:1px solid #262626;
  border-radius:20px;padding:22px 20px;animation:modalPop .25s cubic-bezier(.16,1,.3,1);
  box-shadow:0 20px 60px rgba(0,0,0,.6)}
@keyframes modalPop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;color:var(--text);
  letter-spacing:.5px;margin-bottom:8px;text-align:center}
.modal-msg{font-size:13px;color:var(--t2);line-height:1.5;text-align:center;margin-bottom:16px}
.modal-input{width:100%;background:#0a0a0a;border:1.5px solid #2a2a2a;border-radius:11px;
  color:var(--text);font-size:16px;padding:12px 14px;font-family:'Barlow',sans-serif;
  outline:none;margin-bottom:16px;text-align:center}
.modal-input:focus{border-color:var(--gold)}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;border:none;border-radius:11px;padding:13px;font-size:13px;font-weight:800;
  letter-spacing:1px;cursor:pointer;font-family:'Barlow',sans-serif;transition:opacity .15s,transform .1s;
  -webkit-tap-highlight-color:transparent}
.modal-btn:active{transform:scale(.97)}
.modal-cancel{background:#1c1c1c;border:1px solid #2a2a2a;color:var(--t2)}
.modal-ok{background:linear-gradient(135deg,var(--gold-dk),var(--gold) 60%,#ffd968);color:#000;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.modal-danger{background:linear-gradient(135deg,#7a1f1f,#c0392b);color:#fff}

/* CARDIO */
.cardio-hist-card{display:flex;align-items:center;gap:12px;background:linear-gradient(165deg,#131313,#0e0e0e);
  border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:border-color .15s}
.cardio-hist-card:active{border-color:var(--gold)}
.cardio-hist-ico{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:#0d0d0d;border-radius:11px;flex-shrink:0}
.cardio-type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px}
.cardio-type-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0d0d0d;border:1.5px solid #222;border-radius:14px;padding:16px 6px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:all .15s;min-height:90px}
.cardio-type-pick:active{transform:scale(.95);border-color:var(--gold);background:rgba(240,192,64,.06)}
.cardio-session{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;overflow-y:auto}
.cardio-back{background:none;border:none;color:var(--t2);font-size:22px;cursor:pointer;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;-webkit-tap-highlight-color:transparent}
.cardio-back:active{background:#1a1a1a}
.cardio-session-top{display:flex;align-items:center;justify-content:space-between;padding:16px}
.cardio-clock-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cardio-clock{font-family:'Oswald',sans-serif;font-size:72px;font-weight:700;color:var(--gold);
  letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums}
.cardio-clock-sub{font-size:12px;letter-spacing:3px;color:var(--t3);font-weight:700}
.cardio-controls{display:flex;gap:10px;padding:0 16px;box-sizing:border-box;width:100%}
.cardio-controls .btn-gold,.cardio-controls .btn-dark{width:auto;min-width:0}
.cardio-controls .f1{flex:1 1 0;min-width:0}
.cardio-mode-btn{display:flex;align-items:center;gap:16px;background:#0d0d0d;border:1.5px solid #222;
  border-radius:16px;padding:18px 20px;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;transition:all .15s}
.cardio-mode-btn:active{border-color:var(--gold);background:rgba(240,192,64,.06)}
.cmode-title{font-size:17px;font-weight:800;color:var(--text);font-family:'Oswald',sans-serif;letter-spacing:.5px}
.cmode-sub{font-size:12px;color:var(--t3);margin-top:2px}
.cardio-fields{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.cardio-field{display:flex;flex-direction:column;gap:4px}
.cardio-field label{font-size:11px;color:var(--t2);letter-spacing:1px}
.cardio-input{background:#0a0a0a;border:1.5px solid #2a2a2a;border-radius:11px;color:var(--text);
  font-size:16px;padding:12px 14px;font-family:'Barlow',sans-serif;outline:none;text-align:center}
.cardio-input:focus{border-color:var(--gold)}
.rpe-row{display:flex;gap:5px;margin-top:6px}
.rpe-dot{flex:1;aspect-ratio:1;background:#0d0d0d;border:1.5px solid #222;border-radius:9px;
  color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;padding:0;transition:all .1s}
.rpe-dot.on{background:linear-gradient(135deg,var(--gold-dk),var(--gold));color:#000;border-color:var(--gold)}
.sex-btn{background:#0d0d0d;border:1.5px solid #2a2a2a;border-radius:11px;color:var(--t2);
  font-size:15px;font-weight:800;padding:11px 0;cursor:pointer;font-family:'Oswald',sans-serif;
  -webkit-tap-highlight-color:transparent;transition:all .12s}
.sex-btn.on{background:linear-gradient(135deg,var(--gold-dk),var(--gold));color:#000;border-color:var(--gold)}

/* CLUSTER BLOCKS */
.cluster-blocks-wrap{background:#0a0800;border:1.5px solid #e67e2233;border-radius:14px;padding:10px 10px 6px;margin:4px 0 6px}
.cluster-blocks-label{font-size:9px;color:#e67e22;letter-spacing:2px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.cluster-block-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 28px;gap:5px;align-items:center;margin-bottom:7px}
.cluster-block-num{font-size:11px;font-weight:800;color:#e67e22;font-family:'Oswald',sans-serif;text-align:center}
.cluster-block-inp{background:#111;border:1px solid #2a2a2a;border-radius:7px;color:var(--text);font-size:14px;font-weight:700;font-family:'Barlow',sans-serif;text-align:center;width:100%;padding:6px 4px;outline:none}
.cluster-block-inp:focus{border-color:#e67e22}
.cluster-block-done{width:26px;height:26px;border-radius:7px;background:#111;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.cluster-block-done.done{background:#1a0f00;border-color:#e67e22;color:#e67e22}
.cluster-total-line{font-size:10px;color:#e67e22;letter-spacing:1px;margin-top:2px;padding-top:6px;border-top:1px solid #e67e2222;display:flex;justify-content:space-between;align-items:center}
/* CLUSTER MINI-TIMER */
.cluster-timer{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;margin:4px 0 6px;background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.25);border-radius:10px;animation:clusterTimerIn .25s ease}
@keyframes clusterTimerIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.cluster-timer-ring{width:38px;height:38px;flex-shrink:0;position:relative}
.cluster-timer-ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.cluster-timer-arc{fill:none;stroke:#e67e22;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.cluster-timer-arc-bg{fill:none;stroke:#2a1a00;stroke-width:4}
.cluster-timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#e67e22;font-family:'Oswald',sans-serif}
.cluster-timer-info{flex:1;font-size:11px;color:#e67e22;font-weight:700;letter-spacing:.5px}
.cluster-timer-skip{font-size:10px;color:#e67e22;background:none;border:1px solid #e67e2255;border-radius:6px;padding:4px 8px;cursor:pointer;letter-spacing:1px;font-weight:700}
/* ── REST PAUSE (rosa #e84393) ── */
.rp-blocks-wrap{background:#0d0509;border:1.5px solid #e8439333;border-radius:14px;padding:10px 10px 6px;margin:4px 0 6px}
.rp-blocks-label{font-size:9px;color:#e84393;letter-spacing:2px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.rp-block-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 28px 22px;gap:5px;align-items:center;margin-bottom:7px}
.rp-block-num{font-size:11px;font-weight:800;color:#e84393;font-family:'Oswald',sans-serif;text-align:center}
.rp-block-inp{background:#111;border:1px solid #2a2a2a;border-radius:7px;color:var(--text);font-size:14px;font-weight:700;font-family:'Barlow',sans-serif;text-align:center;width:100%;padding:6px 4px;outline:none}
.rp-block-inp:focus{border-color:#e84393}
.rp-block-done{width:26px;height:26px;border-radius:7px;background:#111;border:1.5px solid #333;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:background .12s,border-color .12s;-webkit-tap-highlight-color:transparent}
.rp-block-done.done{background:#1a0512;border-color:#e84393;color:#e84393}
.rp-block-del{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#666;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rp-block-del:active{color:#e84393}
.rp-add-block{width:100%;background:rgba(232,67,147,.08);border:1px dashed #e8439355;border-radius:9px;color:#e84393;font-size:11px;font-weight:700;letter-spacing:.5px;padding:8px;margin:2px 0 6px;cursor:pointer;font-family:'Barlow',sans-serif;-webkit-tap-highlight-color:transparent}
.rp-add-block:active{background:rgba(232,67,147,.16)}
.rp-total-line{font-size:10px;color:#e84393;letter-spacing:1px;margin-top:2px;padding-top:6px;border-top:1px solid #e8439322;display:flex;justify-content:space-between;align-items:center}
.rp-timer{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;margin:4px 0 6px;background:rgba(232,67,147,.08);border:1px solid rgba(232,67,147,.25);border-radius:10px;animation:clusterTimerIn .25s ease}
.rp-timer-ring{width:38px;height:38px;flex-shrink:0;position:relative}
.rp-timer-ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.rp-timer-arc{fill:none;stroke:#e84393;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.rp-timer-arc-bg{fill:none;stroke:#3a0a22;stroke-width:4}
.rp-timer-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#e84393;font-family:'Oswald',sans-serif}
.rp-timer-info{flex:1;font-size:11px;color:#e84393;font-weight:700;letter-spacing:.5px}
.rp-timer-skip{font-size:10px;color:#e84393;background:none;border:1px solid #e8439355;border-radius:6px;padding:4px 8px;cursor:pointer;letter-spacing:1px;font-weight:700}
/* Card de recuperação / deload — versão refinada */
.deload-card{position:relative;display:flex;gap:14px;align-items:center;border-radius:16px;padding:16px 16px 16px 18px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.deload-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:16px 0 0 16px}
.deload-card.dl-high::before{background:linear-gradient(180deg,#ff6b5e,#e74c3c)}
.deload-card.dl-medium::before{background:linear-gradient(180deg,#f5a623,#e67e22)}
.deload-card.dl-ok::before{background:linear-gradient(180deg,#5fd36a,#4caf50)}
.deload-dot{position:relative;width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.deload-dot .dot-core{width:16px;height:16px;border-radius:50%;position:relative;z-index:2}
.deload-dot .dot-glow{position:absolute;inset:0;border-radius:50%;opacity:.35;animation:dotPulse 2.4s ease-in-out infinite}
.dl-high .dot-core{background:radial-gradient(circle at 35% 30%,#ff8a7d,#e74c3c);box-shadow:0 0 10px rgba(231,76,60,.7)}
.dl-high .dot-glow{background:radial-gradient(circle,rgba(231,76,60,.55),transparent 70%)}
.dl-medium .dot-core{background:radial-gradient(circle at 35% 30%,#f7b955,#e67e22);box-shadow:0 0 10px rgba(230,126,34,.7)}
.dl-medium .dot-glow{background:radial-gradient(circle,rgba(230,126,34,.5),transparent 70%)}
.dl-ok .dot-core{background:radial-gradient(circle at 35% 30%,#7ee089,#4caf50);box-shadow:0 0 10px rgba(76,175,80,.65)}
.dl-ok .dot-glow{background:radial-gradient(circle,rgba(76,175,80,.45),transparent 70%)}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.35);opacity:.12}}
.deload-body{flex:1;min-width:0}
.deload-title{font-size:14px;font-weight:800;font-family:'Oswald',sans-serif;letter-spacing:.5px;margin-bottom:5px}
.deload-msg{font-size:12.5px;color:var(--t2);line-height:1.55}
/* TIMER FLASH — visual feedback when rest ends */
.timer-flash{
  position:fixed;inset:0;z-index:9999;
  pointer-events:none;
  background:rgba(240,192,64,0);
  animation:timerFlash .6s ease-out forwards}
@keyframes timerFlash{
  0%{background:rgba(240,192,64,0)}
  15%{background:rgba(240,192,64,.28)}
  40%{background:rgba(240,192,64,.18)}
  70%{background:rgba(240,192,64,.08)}
  100%{background:rgba(240,192,64,0)}}
/* Brilho pulsante nas bordas quando o timer zera */
.timer-glow{
  position:fixed;inset:0;z-index:99999;pointer-events:none;
  box-shadow:inset 0 0 0 0 rgba(240,192,64,0);
  animation:timerGlow 2.4s ease-out forwards}
@keyframes timerGlow{
  0%{box-shadow:inset 0 0 60px 8px rgba(240,192,64,.9), inset 0 0 140px 30px rgba(240,192,64,.4)}
  12%{box-shadow:inset 0 0 40px 4px rgba(240,192,64,.5), inset 0 0 110px 20px rgba(240,192,64,.25)}
  24%{box-shadow:inset 0 0 70px 10px rgba(240,192,64,.95), inset 0 0 150px 34px rgba(240,192,64,.45)}
  40%{box-shadow:inset 0 0 40px 4px rgba(240,192,64,.4), inset 0 0 110px 20px rgba(240,192,64,.2)}
  60%{box-shadow:inset 0 0 60px 8px rgba(240,192,64,.7), inset 0 0 130px 26px rgba(240,192,64,.3)}
  100%{box-shadow:inset 0 0 0 0 rgba(240,192,64,0)}}
/* Pílula flutuante do timer minimizado */
.timer-pill{
  position:fixed;z-index:9998;
  right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;
  background:rgba(20,16,0,.96);border:1.5px solid var(--gold);
  border-radius:30px;padding:9px 10px 9px 14px;
  box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 14px rgba(240,192,64,.25);
  font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:var(--gold);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:pillIn .3s cubic-bezier(.16,1,.3,1)}
@keyframes pillIn{from{transform:translateY(20px) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.timer-pill-ico{font-size:15px}
.timer-pill-x{
  background:#2a2200;border:none;color:var(--gold);
  width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-left:2px;flex-shrink:0}
.timer-pill-x:active{background:#3a2f00}
/* Link "Desativar timer" no overlay */
.timer-stop-link{
  background:none;border:none;color:var(--t3);font-size:12px;
  letter-spacing:1px;cursor:pointer;margin-top:14px;padding:8px;
  font-family:'Barlow',sans-serif;text-decoration:underline;text-underline-offset:3px}
.timer-stop-link:active{color:var(--danger)}
/* STEPPER BUTTONS — +/- for reps and weight */
.stepper-wrap{display:flex;align-items:center;gap:0;width:100%;height:100%}
.stepper-btn{
  background:#111;border:1px solid #222;color:var(--t2);
  font-size:18px;font-weight:700;line-height:1;
  cursor:pointer;flex-shrink:0;
  width:26px;height:100%;min-height:40px;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  user-select:none;-webkit-user-select:none}
.stepper-btn:first-child{border-radius:7px 0 0 7px;border-right:none}
.stepper-btn:last-child{border-radius:0 7px 7px 0;border-left:none}
.stepper-btn:active{background:var(--bg4);color:var(--gold)}
.stepper-inp{
  flex:1;min-width:0;
  background:#0a0a0a;border:1px solid #222;border-left:none;border-right:none;
  color:var(--text);font-size:16px;font-weight:700;
  text-align:center;font-family:'Barlow',sans-serif;
  height:100%;min-height:40px;padding:0;outline:none;
  -moz-appearance:textfield}
.stepper-inp:focus{border-top-color:var(--gold);border-bottom-color:var(--gold);z-index:1;position:relative}
.stepper-inp::-webkit-inner-spin-button,.stepper-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.plateau-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(243,156,18,.12),rgba(243,156,18,.03));border:1px solid rgba(243,156,18,.28);
  border-radius:10px;padding:6px 11px;font-size:11px;color:#f5b041;letter-spacing:.3px;margin-top:6px;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
/* WEEKLY VOLUME BARS */
.wvol-bar-row{display:flex;align-items:flex-end;gap:6px;height:auto;min-height:76px;padding:8px 16px 0;margin-bottom:4px}
/* Gráfico de carga semanal (aba Progressão) */
.wkload-bars{display:flex;align-items:flex-end;gap:5px;min-height:104px;padding:8px 0 0}
.wkload-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px;justify-content:flex-end}
.wkload-val{font-size:9px;font-weight:700;text-align:center;min-height:11px}
.wkload-bar-bg{width:100%;height:74px;background:var(--border);border-radius:5px 5px 0 0;display:flex;align-items:flex-end}
.wkload-bar-fill{width:100%;border-radius:5px 5px 0 0;transition:height .5s ease;min-height:2px}
.wkload-lbl{font-size:8px;letter-spacing:.3px;text-align:center;white-space:nowrap}
.wvol-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px}
.wvol-bar-bg2{width:100%;background:var(--border);border-radius:4px 4px 0 0;position:relative;display:flex;align-items:flex-end}
.wvol-bar-fill2{width:100%;border-radius:4px 4px 0 0;transition:height .5s ease;min-height:2px}
.wvol-lbl{font-size:8px;color:var(--t3);letter-spacing:.5px;text-align:center;white-space:nowrap}
.wvol-val{font-size:8px;color:var(--gold);font-weight:700;text-align:center}
/* PREDICTED DAYS */
.pred-days{display:flex;gap:6px;padding:0 16px;margin-top:8px;flex-wrap:wrap}
.pred-day{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px}
.excard{transition:box-shadow .18s ease,transform .18s ease,opacity .18s ease}
.excard.dragging{opacity:.96;transform:scale(1.04) rotate(-1deg);box-shadow:0 16px 36px rgba(0,0,0,.55),0 0 0 2px var(--gold);z-index:50;position:relative;transition:box-shadow .18s ease,opacity .18s ease}
.excard.drag-over{box-shadow:0 -3px 0 0 var(--gold);transform:translateY(3px);border-top-color:var(--gold)}
.rrow{transition:box-shadow .18s ease,transform .18s ease,opacity .18s ease}
.rrow.dragging{opacity:.96;transform:scale(1.04) rotate(-1deg);box-shadow:0 16px 36px rgba(0,0,0,.55),0 0 0 2px var(--gold);z-index:50;position:relative;transition:box-shadow .18s ease,opacity .18s ease}
.rrow.drag-over{box-shadow:0 -3px 0 0 var(--gold);transform:translateY(3px)}
.rrow-handle{margin-left:-4px}
/* Durante o reordenamento de exercícios: minimiza todos os cards expandidos
   (mostra só o cabeçalho com o nome), facilitando reposicionar. */
body.reordering-ex .excard > *:not(.ex-head){display:none}
body.reordering-ex .excard{padding:10px 12px;margin-bottom:6px;transition:padding .15s,margin .15s}
body.reordering-ex .excard .ex-head{margin-bottom:0}
/* esconde os botões minimizar/opções e sugestões no modo reorder p/ ficar limpo */
body.reordering-ex .ex-collapse-btn,body.reordering-ex .ex-menu-btn,
body.reordering-ex .muscle-tag,body.reordering-ex .plateau-badge,
body.reordering-ex .suggest-badge,body.reordering-ex .enb-change,
body.reordering-ex .mini-chart-wrap{display:none}
.drag-handle{background:none;border:none;cursor:grab;padding:6px 4px;color:#333;display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0;touch-action:none;-webkit-user-select:none;user-select:none}
.drag-handle:active{cursor:grabbing;color:var(--gold)}
.drag-handle span{display:block;width:14px;height:1.5px;background:currentColor;border-radius:1px}
/* GOAL PROGRESS */
.goal-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.goal-bar-wrap{flex:1}
.goal-bar-bg{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.goal-bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.goal-pct{font-size:10px;font-weight:700;letter-spacing:.5px;text-align:right;margin-top:2px}
.goal-set-btn{background:none;border:1px solid #2a2a2a;border-radius:6px;color:var(--t3);font-size:10px;padding:3px 7px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.goal-set-btn:active{border-color:var(--gold);color:var(--gold)}
.divider{height:1px;background:var(--border);margin:12px 16px}
.fr{display:flex;gap:8px;align-items:center}.f1{flex:1;min-width:0}
.px16{padding-left:16px;padding-right:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.pb80{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}.pb120{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.tg{color:var(--gold)}.td{color:var(--t3)}.ts{font-size:12px}.txs{font-size:11px}
.fw8{font-weight:800}.osw{font-family:'Oswald',sans-serif}
.empty{text-align:center;color:#5a5a5a;padding:48px 24px;font-size:14px;line-height:1.7}
.empty-ico{font-size:38px;line-height:1;margin:0 auto 16px;width:82px;height:82px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(240,192,64,.08),rgba(240,192,64,.02) 65%,transparent);border:1px solid rgba(240,192,64,.12);opacity:.95}
.empty-title{color:var(--t2);font-weight:700;font-size:15px;margin-bottom:6px;font-family:'Oswald',sans-serif;letter-spacing:.3px}
.empty-sub{color:#666;font-size:13px;line-height:1.6}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#1c1c1c;border-radius:2px}

/* ── Telas pequenas (≤ 374px de largura, ex.: iPhone SE/Mini) ── */
/* Dá mais espaço aos campos de reps/peso sem afetar telas maiores. */
@media (max-width:374px){
  /* Colunas fixas mais estreitas → sobra mais largura para os inputs */
  .set-grid6{grid-template-columns:26px 30px 1fr 1fr 26px;gap:3px}
  .set-hdr{font-size:8px}
  /* Botões +/- do stepper um pouco menores, liberando o número */
  .stepper-btn{width:21px;min-height:42px;font-size:16px}
  .stepper-inp{font-size:17px;min-height:42px}
  .set-last-cell{font-size:9px}
  .set-num-btn{font-size:12px}
  /* HUD em modo execução: garante números grandes e toque confortável */
  .exec-set-row{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px;gap:5px;padding:9px 9px}
  .exec-set-row .set-in{font-size:21px;height:50px}
}
/* ── Telas muito pequenas (≤ 339px, aparelhos antigos) ── */
@media (max-width:339px){
  /* Esconde a coluna "ANT." e usa 4 colunas para dar espaço total aos campos */
  .set-grid6{grid-template-columns:24px 1fr 1fr 24px}
  .set-grid6 .set-hdr:nth-child(2),.set-grid6 .set-last-cell{display:none}
  .stepper-btn{width:19px}
}
</style>

// ── MANUTENÇÃO DO CATÁLOGO ─────────────────────────
// Exercícios são identificados só pelo NOME em todo o app (S.prs, rotinas, log,
// ALL_EX_MAP). Isso é simples, mas quer dizer que renomear um item do CATALOG
// acima, sem mais nada, deixa PRs e histórico "órfãos" (indexados pelo nome
// antigo, que não existe mais em ALL_EX_MAP — silenciosamente somem das telas
// de volume por músculo e sugestão, mas continuam ocupando espaço no S.prs).
//
// Se um dia precisar renomear um exercício do catálogo, chame esta função no
// console (ou uma vez no boot, antes do render) para migrar tudo junto:
//   renameCatalogExercise('NOME ANTIGO', 'NOME NOVO')
// Não é chamada automaticamente por nada — é uma ferramenta de manutenção.
function renameCatalogExercise(oldName,newName){
  if(!oldName||!newName||oldName===newName)return;
  let touched=0;
  if(S.prs&&oldName in S.prs){
    if(!(newName in S.prs)||S.prs[oldName]>S.prs[newName])S.prs[newName]=S.prs[oldName];
    delete S.prs[oldName];touched++;
  }
  (S.routines||[]).forEach(r=>(r.exercises||[]).forEach(ex=>{if(ex.name===oldName){ex.name=newName;touched++;}}));
  (S.log||[]).forEach(l=>(l.exercises||[]).forEach(ex=>{if(ex.name===oldName){ex.name=newName;touched++;}}));
  save(S);
  console.log('renameCatalogExercise: '+touched+' referências migradas de "'+oldName+'" para "'+newName+'".');
  return touched;
}

// ── PERFIL FÍSICO + CÁLCULOS ──
// Idade calculada a partir do ano de nascimento, se houver
function getUserAge(){
  const p=S.user&&S.user.profile;
  if(p&&p.age)return p.age;
  return null;
}
// Estima calorias do cardio.
// Se houver batimentos (bpm), usa a fórmula de Keytel (mais precisa, baseada em FC).
// Senão, recorre a uma estimativa por MET da modalidade × peso × tempo.
function estimateCardioCalories({typeId,seconds,bpm}){
  const p=(S.user&&S.user.profile)||{};
  const weight=parseFloat(p.weight)||0;
  const age=parseFloat(p.age)||0;
  const sex=p.sex||'';
  const minutes=(seconds||0)/60;
  if(!weight||!minutes)return null;
  // Fórmula de Keytel et al. (2005) — requer FC, peso, idade e sexo
  if(bpm&&age&&(sex==='M'||sex==='F')){
    let kcalMin;
    if(sex==='M'){
      kcalMin=(-55.0969+0.6309*bpm+0.1988*weight+0.2017*age)/4.184;
    }else{
      kcalMin=(-20.4022+0.4472*bpm-0.1263*weight+0.074*age)/4.184;
    }
    if(kcalMin>0)return Math.round(kcalMin*minutes);
  }
  // Fallback por MET aproximado da modalidade
  const METS={esteira:8.5,bike:7,eliptico:5,airbike:8,remo:7,escada:9,corrida:9.8,pular_corda:11,caminhada:3.8,outro:6};
  const met=METS[typeId]||6;
  return Math.round(met*3.5*weight/200*minutes);
}
function calcIMC(){
  const p=(S.user&&S.user.profile)||{};
  const w=parseFloat(p.weight),h=parseFloat(p.height);
  if(!w||!h)return null;
  const m=h/100;
  return Math.round((w/(m*m))*10)/10;
}
function imcClass(imc){
  if(imc==null)return'';
  if(imc<18.5)return'Abaixo do peso';
  if(imc<25)return'Peso normal';
  if(imc<30)return'Sobrepeso';
  if(imc<35)return'Obesidade I';
  if(imc<40)return'Obesidade II';
  return'Obesidade III';
}
function getFCMax(){
  const age=getUserAge();
  if(!age)return null;
  return Math.round(208-0.7*age); // fórmula de Tanaka (mais precisa que 220-idade)
}

// Migração de dados: garante compatibilidade entre versões.
// BLINDADA: recupera campo-a-campo. Se uma seção estiver corrompida
// (tipo errado), cai só o default DAQUELA seção — nunca reseta tudo.
function migrateData(s){
  if(!s||typeof s!=='object'||Array.isArray(s))return {...DEF};
  const isArr=Array.isArray, isObj=v=>v&&typeof v==='object'&&!isArr(v);

  // Escalares e coleções de topo: valida o tipo esperado; se não bater, usa o default.
  if(typeof s.restSeconds!=='number'||!(s.restSeconds>0))s.restSeconds=90;
  if(!isArr(s.medals))s.medals=[];
  if(!isObj(s.prs))s.prs={};
  if(!isObj(s.stats))s.stats={totalWorkouts:0,totalPRs:0,maxVolume:0,totalRoutines:0};
  else{
    // Garante que cada contador exista e seja número
    ['totalWorkouts','totalPRs','maxVolume','totalRoutines'].forEach(k=>{
      if(typeof s.stats[k]!=='number'||isNaN(s.stats[k]))s.stats[k]=0;
    });
  }
  if(!isObj(s.weeklyGoals))s.weeklyGoals={};
  if(!isArr(s.cardioLog))s.cardioLog=[];
  if(!isArr(s.routines))s.routines=[];
  if(!isArr(s.log))s.log=[];
  if(s.seenTutorial===undefined)s.seenTutorial=false;

  // Sessão de treino em andamento (permite retomar caso o app feche sem finalizar)
  if(s.activeSession!==null&&!isObj(s.activeSession))s.activeSession=null;
  if(isObj(s.activeSession)){
    if(typeof s.activeSession.routineId!=='string')s.activeSession=null;
    else{
      if(typeof s.activeSession.exIdx!=='number')s.activeSession.exIdx=0;
      if(!isObj(s.activeSession.setsDone))s.activeSession.setsDone={};
      if(!isObj(s.activeSession.expandedCards))s.activeSession.expandedCards={};
      if(typeof s.activeSession.workoutStart!=='number')s.activeSession.workoutStart=null;
      s.activeSession.workoutMode=!!s.activeSession.workoutMode;
    }
  }

  // user: pode ser null (não cadastrado). Se existir, precisa ser objeto com nome válido.
  if(s.user!==null){
    if(!isObj(s.user)||typeof s.user.name!=='string'||!s.user.name.trim()){
      // Estrutura de usuário irrecuperável: trata como não cadastrado
      s.user=null;
    }else{
      if(!isObj(s.user.profile))s.user.profile={weight:'',height:'',age:'',sex:''};
      if(!isArr(s.user.weightHistory))s.user.weightHistory=[];
      // Foto do perfil: só aceita data: URL de imagem, dentro de um tamanho plausível.
      // Isso bloqueia um backup (.json) importado de terceiro que tente injetar HTML/JS
      // no atributo src do avatar (ex.: "user":{"pic":"x\" onerror=\"..."}).
      if(typeof s.user.pic!=='string'||!/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s.user.pic)||s.user.pic.length>4000000){
        delete s.user.pic;
      }
    }
  }

  // Saneia rotinas: descarta entradas malformadas em vez de deixar quebrar telas depois.
  s.routines=s.routines.filter(isObj).map(r=>{
    if(!isArr(r.exercises))r.exercises=[];
    r.exercises=r.exercises.filter(isObj).map(ex=>{
      if(ex.note===undefined||typeof ex.note!=='string')ex.note='';
      if(ex.superset===undefined)ex.superset=null;
      if(!isArr(ex.sets))ex.sets=[];
      ex.sets=ex.sets.filter(isObj).map(set=>{
        if(!set.type)set.type='valida';
        return set;
      });
      return ex;
    });
    return r;
  });

  // Saneia histórico de logs.
  s.log=s.log.filter(isObj).map(entry=>{
    if(!isArr(entry.exercises))entry.exercises=[];
    entry.exercises=entry.exercises.filter(isObj).map(ex=>{
      if(!isArr(ex.sets))ex.sets=[];
      ex.sets=ex.sets.filter(isObj).map(set=>{
        if(!set.type)set.type='valida';
        return set;
      });
      return ex;
    });
    return entry;
  });

  return s;
}

// ── EQUIPMENT INFERENCE (from exercise name, Hevy-style filter) ──
function getEquipment(name){
  if(!name)return 'Outro';
  const n=name.toUpperCase();
  if(/\bSMITH\b/.test(n))return 'Smith';
  if(/HALTER|HALTERES|DUMBBELL/.test(n))return 'Halter';
  if(/\bBARRA\b|BARBELL|\bW\b|EZ/.test(n))return 'Barra';
  if(/M[ÁA]QUINA|MACHINE|ARTICULAD|PECK|LEG PRESS|HACK|CROSSOVER|VOADOR|GRAVITRON/.test(n))return 'Máquina';
  if(/CABO|CORDA|POLIA|PULLEY|CROSS|PULLDOWN|PUXAD|REMADA BAIXA|TR[ÍI]CEPS (NA |NO )?(CORDA|POLIA|BARRA)/.test(n))return 'Cabo';
  if(/BARRA FIXA|PARALELA|MERGULHO|FLEX[ÃA]O|PRANCHA|ABDOMINAL|CORPO|PESO CORPORAL|DIP/.test(n))return 'Peso corporal';
  if(/KETTLEBELL/.test(n))return 'Kettlebell';
  if(/EL[ÁA]STICO|BAND/.test(n))return 'Elástico';
  return 'Outro';
}

function load(){
  const raw=localStorage.getItem('loadup4');
  if(raw==null)return {...DEF};
  try{
    return migrateData(JSON.parse(raw)||DEF);
  }catch(e){
    // JSON realmente ilegível: NÃO sobrescreve. Guarda uma cópia bruta para
    // eventual recuperação manual e avisa (uma vez), evitando perda silenciosa.
    try{
      if(!localStorage.getItem('loadup4_corrupted'))localStorage.setItem('loadup4_corrupted',raw);
    }catch(_){/* storage cheio: ignora */}
    if(!window._loadWarned){
      window._loadWarned=true;
      setTimeout(()=>{try{notify('⚠ Dados locais ilegíveis. Restaure um backup em Perfil → Backup.');}catch(_){}} ,1500);
    }
    return {...DEF};
  }
}
function save(s){
  try{
    localStorage.setItem('loadup4',JSON.stringify(s));
    // Marca quando foi o último salvamento local, para não perguntar à toa se
    // deve restaurar o backup da nuvem quando não há nada mais novo lá.
    try{localStorage.setItem('loadup4_savedAt',new Date().toISOString());}catch(_){}
    return true;
  }catch(e){
    // Armazenamento cheio ou modo privado: um toast que some em 3s é fácil de
    // não ver — principalmente no meio de um treino. Por isso, além do toast,
    // abre um modal persistente (uma vez por sessão) com o botão de exportar
    // já à mão, em vez de só um aviso passivo.
    if(!window._saveWarned){
      window._saveWarned=true;
      try{notify('⚠ Não foi possível salvar.');}catch(_){}
      try{
        setTimeout(()=>{
          openConfirm('Não foi possível salvar seus dados','O armazenamento local está cheio ou indisponível (comum em aba anônima/privada). Enquanto isso não for resolvido, o que você fizer pode não ser salvo. Exporte um backup agora pra não correr risco.',
            ()=>exportData(),{okLabel:'Exportar backup agora',danger:true});
        },400);
      }catch(_){}
    }
    return false;
  }
}
// Testa se dá pra gravar no localStorage (modo privado/quota zerada às vezes
// falha sem lançar erro perceptível cedo). Roda uma vez no boot, antes de
// qualquer treino ser feito, em vez de só descobrir no primeiro save() que falhar.
function testStorageAvailable(){
  try{
    const k='__loadup_storage_test__';
    localStorage.setItem(k,'1');
    localStorage.removeItem(k);
    return true;
  }catch(e){return false;}
}
// Save com debounce: agrupa gravações rápidas (digitação de reps/peso) num só write
let _saveTimer=null;
function saveDebounced(s){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{save(s);},400);
}
// Garante que qualquer save pendente seja gravado imediatamente (ex.: ao finalizar treino)
function flushSave(){
  if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;save(S);}
}
// Exporta todos os dados como arquivo JSON para download
function exportData(){
  try{
    const data=JSON.stringify(S,null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const stamp=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);
    a.href=url;a.download='loadup-backup-'+stamp+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
    notify('Backup exportado! 💾');
  }catch(e){notify('Erro ao exportar backup.');}
}
// Importa dados de um arquivo JSON
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      // Validação estrutural mínima: precisa ser um objeto de estado plausível.
      // Exige as seções-chave com o tipo certo; o migrateData saneia o resto.
      const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
      const ok = isObj(data)
        && Array.isArray(data.routines)
        && (data.log===undefined || Array.isArray(data.log))
        && (data.user===undefined || data.user===null || isObj(data.user));
      if(!ok){
        notify('Arquivo inválido: não parece um backup do LoadUp.');return;
      }
      openConfirm('Importar backup?','Isso substituirá todos os dados atuais do app.',()=>{
        try{
          S=migrateData(data);save(S);notify('Backup importado! ✓');render();
        }catch(err2){
          notify('Não foi possível importar: backup corrompido.');
        }
      });
    }catch(err){notify('Erro ao ler o arquivo (JSON inválido).');}
  };
  reader.onerror=()=>notify('Erro ao ler o arquivo.');
  reader.readAsText(file);
}

// ── VOLUME ────────────────────────────────────────
// Peso EFETIVO de cada série para volume/contagem por grupo muscular:
//  - 1-2 RIR (valida), Falha, Back Off, Cluster  → 1 série completa
//  - Drop Set → 0,5 série (meia série válida)
//  - Aquecimento, Preparatória → 0 (não conta)
function effectiveSetWeight(s){
  const t=s.type||'valida';
  if(t==='dropset'||t==='restpause')return 0.5; // meia série válida
  if(t==='valida'||t==='falha'||t==='backoff'||t==='cluster')return 1;
  return 0;
}
function isEffectiveSet(s){return effectiveSetWeight(s)>0;}
function calcSetVol(s){
  const t=s.type||'valida';
  // Aquecimento e preparatória não contam como volume de treino — mesmo critério
  // usado em effectiveSetWeight(), pra "Volume" bater com a distribuição por músculo
  // em todos os lugares (tela de finalização, imagem de compartilhar, maxVolume).
  if(t==='aquecimento'||t==='preparatoria')return 0;
  // Cluster e Rest Pause somam o volume de cada mini-bloco (reps × peso)
  if((t==='cluster'||t==='restpause')&&s.clusterBlocks&&s.clusterBlocks.length){
    return s.clusterBlocks.reduce((a,b)=>{
      return a+(parseFloat(b.reps)||0)*(parseFloat(b.weight)||parseFloat(s.weight)||0);
    },0);
  }
  return(parseFloat(s.reps)||0)*(parseFloat(s.weight)||0);
}
function calcExVol(ex){return ex.sets.reduce((a,s)=>a+calcSetVol(s),0)}
// Volume contando séries efetivas, ponderado pelo peso efetivo (drop = metade)
function calcExEffectiveVol(ex){return ex.sets.reduce((a,s)=>a+calcSetVol(s)*effectiveSetWeight(s),0)}
function calcTotalVol(exs){return exs.reduce((a,ex)=>a+calcExVol(ex),0)}
function getMuscleVolume(exs){
  const map={};
  exs.forEach(ex=>{
    const cfg=ALL_EX_MAP[ex.name];if(!cfg)return;
    const v=calcExEffectiveVol(ex);if(!v)return;
    Object.entries(cfg.contrib).forEach(([m,f])=>{map[m]=(map[m]||0)+v*f});
  });
  return map;
}
// Início da semana corrente = domingo passado à meia-noite (00:00).
// Os contadores semanais zeram automaticamente na virada de sábado p/ domingo.
function startOfWeek(){
  const d=new Date();
  d.setHours(0,0,0,0);        // zera horas (vai para 00:00 de hoje)
  d.setDate(d.getDate()-d.getDay()); // volta para o domingo (getDay(): 0=domingo)
  return d.getTime();
}
// Início do mês atual (00:00 do dia 1). Os contadores do mês zeram na virada do mês.
function startOfMonth(){
  const d=new Date();
  d.setHours(0,0,0,0);
  d.setDate(1);              // vai para o dia 1 do mês atual
  return d.getTime();
}
function getWeekMVol(){
  const cut=startOfWeek(),map={};
  S.log.filter(l=>new Date(l.date).getTime()>=cut).forEach(l=>{
    Object.entries(getMuscleVolume(l.exercises)).forEach(([m,v])=>{map[m]=(map[m]||0)+v});
  });
  return map;
}
function getAllMVol(){
  const map={};
  S.log.forEach(l=>{Object.entries(getMuscleVolume(l.exercises)).forEach(([m,v])=>{map[m]=(map[m]||0)+v})});
  return map;
}
// Conta séries EFETIVAS por músculo, ponderadas (drop = 0,5; back off/cluster/valida/falha = 1)
function getMuscleSets(exs){
  const map={};
  exs.forEach(ex=>{
    const cfg=ALL_EX_MAP[ex.name];if(!cfg)return;
    const validSets=ex.sets.reduce((a,s)=>a+effectiveSetWeight(s),0);
    if(!validSets)return;
    Object.entries(cfg.contrib).forEach(([m,f])=>{
      map[m]=(map[m]||0)+Math.round(validSets*f*10)/10;
    });
  });
  return map;
}
function getWeekMSets(){
  const cut=startOfWeek(),map={};
  S.log.filter(l=>new Date(l.date).getTime()>=cut).forEach(l=>{
    Object.entries(getMuscleSets(l.exercises)).forEach(([m,v])=>{map[m]=(map[m]||0)+v});
  });
  return map;
}
function getAllMSets(){
  const cut=startOfMonth(),map={};
  S.log.filter(l=>new Date(l.date).getTime()>=cut).forEach(l=>{
    Object.entries(getMuscleSets(l.exercises)).forEach(([m,v])=>{map[m]=(map[m]||0)+v});
  });
